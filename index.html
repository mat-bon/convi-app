<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperPrecios AR</title>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#F4F5F8; font-family:'Segoe UI',system-ui,sans-serif; }
 
    .header { background:#111827; color:#fff; padding:16px 24px;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:12px; position:sticky; top:0; z-index:50;
      box-shadow:0 4px 24px rgba(0,0,0,.4); }
    .header h1 { font-size:20px; font-weight:900; letter-spacing:-.5px; }
    .header h1 span { color:#FFD600; }
    .header p { font-size:11px; color:#888; margin-top:2px; }
 
    .stats { display:flex; gap:10px; flex-wrap:wrap; }
    .stat { background:#2a2a2a; padding:10px 16px; border-radius:12px; text-align:center; }
    .stat-val { font-size:20px; font-weight:900; }
    .stat-lbl { color:#888; font-size:11px; }
 
    .container { max-width:1200px; margin:0 auto; padding:20px 16px; }
 
    .filters { background:#fff; border-radius:14px; padding:14px 18px;
      margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .filter-row { display:flex; flex-wrap:nowrap; gap:8px; align-items:center; margin-bottom:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-row:last-child { margin-bottom:0; }
    .filter-label { font-size:11px; color:#9ca3af; width:90px; flex-shrink:0; }
 
    .pill { padding:6px 14px; border-radius:24px; font-size:12.5px; font-weight:700;
      border:1.5px solid #e0e0e0; background:#fff; color:#555;
      cursor:pointer; transition:all .15s; white-space:nowrap; }
    .pill.active { border:none; color:#fff; }
 
    .search { position:relative; margin-bottom:14px; }
    .search span { position:absolute; left:14px; top:50%; transform:translateY(-50%); }
    .search input { width:100%; padding:12px 14px 12px 40px; font-size:14px;
      border:1.5px solid #e5e7eb; border-radius:12px; background:#fff;
      outline:none; font-family:inherit; }
    .search input:focus { border-color:#FFD600; }
 
    .result-count { font-size:13px; color:#9ca3af; margin-bottom:12px; }
 
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
 
    .card { background:#fff; border-radius:16px; padding:16px 18px;
      border:1.5px solid #ebebeb; box-shadow:0 2px 10px rgba(0,0,0,.05);
      display:flex; flex-direction:column; gap:10px; position:relative;
      transition:all .18s; cursor:pointer; }
    .card:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(0,0,0,.12); }
    .card.oferta { border-color:#FFD600; box-shadow:0 4px 16px rgba(255,214,0,.15); }
 
    .card-actions { position:absolute; top:12px; right:12px; display:flex; gap:6px; align-items:center; z-index:2; }
    .fav-btn { background:none; border:none; cursor:pointer; font-size:18px; padding:2px; transition:all .15s; }
    .cart-btn { background:none; border:1.5px solid #e0e0e0; cursor:pointer; font-size:12px;
      padding:3px 8px; border-radius:20px; transition:all .15s; font-weight:700;
      color:#555; white-space:nowrap; }
    .cart-btn.en-carrito { background:#111827; border-color:#111827; color:#FFD600; }
    .cart-btn:hover { transform:scale(1.05); }
 
    .badges { display:flex; gap:5px; flex-wrap:wrap; padding-right:110px; }
    .super-badge { font-size:10px; font-weight:800; padding:2px 8px;
      border-radius:20px; letter-spacing:.5px; }
    .super-logo-circle { border-radius:50%; background:#fff; display:inline-flex;
      align-items:center; justify-content:center; flex-shrink:0;
      box-shadow:0 1px 3px rgba(0,0,0,.18); overflow:hidden; }
    .super-logo-circle img { width:100%; height:100%; object-fit:contain; display:block; }
    .super-logo-square { border-radius:14px; background:#fff;
      display:inline-flex; align-items:center; justify-content:center;
      flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.15); overflow:hidden; }
    .super-logo-square img { width:100%; height:100%; object-fit:contain; display:block; }
    .header-logos { display:flex; gap:8px; align-items:center; }
    .cat-badge { font-size:10px; color:#999; padding:2px 7px;
      background:#f5f5f5; border-radius:20px; }
    .time-badge { font-size:10px; color:#bbb; padding:2px 7px;
      background:#f9f9f9; border-radius:20px; margin-left:auto; }
 
    .product-name { font-size:13.5px; font-weight:600; color:#1a1a1a; line-height:1.4; }
 
    .prices { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .price { font-size:24px; font-weight:900; letter-spacing:-1px; }
    .price.normal { color:#1a1a1a; }
    .price.oferta { color:#E91E63; }
    .price-original { font-size:13px; color:#ccc; text-decoration:line-through; }
    .discount { font-size:12px; font-weight:800; color:#E91E63;
      background:#FCE4EC; padding:2px 7px; border-radius:10px; }
 
    .promo { display:inline-flex; align-items:center; gap:3px;
      color:#fff; font-size:10px; font-weight:800; padding:3px 8px;
      border-radius:20px; letter-spacing:.4px; text-transform:uppercase; }
 
    .empty { text-align:center; padding:60px 20px; color:#d1d5db;
      background:#fff; border-radius:16px; }
    .empty div { font-size:56px; }
 
    .tabs { display:flex; border-bottom:2px solid #e5e7eb;
      background:#fff; border-radius:12px 12px 0 0; overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
    .tab { padding:12px 24px; font-size:13.5px; font-weight:700;
      border:none; background:none; cursor:pointer; color:#9ca3af;
      border-bottom:3px solid transparent; margin-bottom:-2px;
      transition:all .15s; flex:1; }
    .tab.active { color:#111827; border-bottom-color:#FFD600; }
 
    .footer { margin-top:36px; padding:18px 22px; background:#111827;
      border-radius:16px; color:#6b7280; font-size:12px; line-height:1.8; }
    .footer strong { color:#FFD600; }
 
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6);
      z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal { background:#fff; border-radius:20px; width:100%; max-width:520px;
      max-height:90vh; overflow-y:auto; padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal-header { display:flex; justify-content:space-between; align-items:flex-start;
      gap:12px; margin-bottom:16px; }
    .modal-title { font-size:15px; font-weight:700; color:#1a1a1a; line-height:1.4; }
    .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:#9ca3af; flex-shrink:0; }
    .modal-close:hover { color:#1a1a1a; }
    .modal-section { font-size:11px; font-weight:700; color:#9ca3af;
      text-transform:uppercase; letter-spacing:.5px; margin:20px 0 10px; }
    .modal-link { display:inline-flex; align-items:center; gap:6px;
      margin-top:16px; padding:10px 18px; background:#111827; color:#fff;
      border-radius:10px; font-size:13px; font-weight:700; text-decoration:none; }
    .modal-link:hover { background:#374151; }
    .history-empty { text-align:center; padding:24px; color:#d1d5db; font-size:13px; }
    .auth-input { width:100%; padding:11px 14px; font-size:14px; border:1.5px solid #e5e7eb;
      border-radius:10px; outline:none; font-family:inherit; margin-bottom:10px; }
    .auth-input:focus { border-color:#FFD600; }
    .auth-btn { width:100%; padding:12px; background:#111827; color:#fff; border:none;
      border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .auth-btn:hover { background:#374151; }
    .auth-link { background:none; border:none; color:#6b7280; font-size:13px;
      cursor:pointer; text-decoration:underline; font-family:inherit; margin-top:8px; }
 
    /* Carrito */
    .carrito-empty { text-align:center; padding:60px 20px; background:#fff;
      border-radius:16px; color:#9ca3af; }
    .carrito-super-section { background:#fff; border-radius:16px; margin-bottom:16px;
      border:1.5px solid #ebebeb; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .carrito-super-header { display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px; border-bottom:1px solid #f3f4f6; }
    .carrito-super-title { display:flex; align-items:center; gap:10px; }
    .carrito-comprar-btn { padding:9px 18px; border:none; border-radius:10px;
      font-size:13px; font-weight:800; cursor:pointer; transition:all .15s;
      text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .carrito-comprar-btn:hover { opacity:.85; transform:translateY(-1px); }
    .carrito-item { display:flex; align-items:center; gap:12px; padding:12px 18px;
      border-bottom:1px solid #f9fafb; }
    .carrito-item:last-child { border-bottom:none; }
    .carrito-item-img { width:48px; height:48px; object-fit:contain;
      border-radius:8px; background:#f9f9f9; flex-shrink:0; }
    .carrito-item-img-placeholder { width:48px; height:48px; border-radius:8px;
      background:#f3f4f6; flex-shrink:0; display:flex; align-items:center;
      justify-content:center; font-size:20px; }
    .carrito-item-info { flex:1; min-width:0; }
    .carrito-item-name { font-size:13px; font-weight:600; color:#1a1a1a;
      line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .carrito-item-precio { font-size:15px; font-weight:900; color:#1a1a1a; margin-top:2px; }
    .carrito-item-remove { background:none; border:none; cursor:pointer;
      color:#d1d5db; font-size:18px; padding:4px; transition:color .15s; flex-shrink:0; }
    .carrito-item-remove:hover { color:#E91E63; }
    .qty-control { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .qty-btn { width:28px; height:28px; border-radius:50%; border:1.5px solid #e0e0e0;
      background:#fff; font-size:16px; font-weight:700; cursor:pointer; color:#374151;
      display:flex; align-items:center; justify-content:center; transition:all .15s; line-height:1; }
    .qty-btn:hover:not(:disabled) { background:#111827; color:#FFD600; border-color:#111827; }
    .qty-btn:disabled { opacity:.35; cursor:not-allowed; }
    .qty-val { font-size:14px; font-weight:800; color:#1a1a1a; min-width:20px; text-align:center; }
    .carrito-total { display:flex; justify-content:space-between; align-items:center;
      padding:12px 18px; background:#f9fafb; font-size:13px; color:#6b7280; }
    .carrito-total strong { color:#1a1a1a; font-size:16px; }
    .carrito-dino-note { background:#FFF8E1; border:1px solid #FFD600; border-radius:10px;
      padding:10px 14px; font-size:12px; color:#92400e; margin-bottom:16px; }
    .confirm-modal { background:#fff; border-radius:20px; width:100%; max-width:440px;
      padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .confirm-modal-title { font-size:17px; font-weight:900; color:#1a1a1a; margin-bottom:8px; }
    .confirm-modal-warning { background:#FFF8E1; border:1px solid #FFD600; border-radius:10px;
      padding:12px 14px; font-size:12.5px; color:#92400e; margin:14px 0; line-height:1.6; }
    .confirm-modal-btns { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
    .confirm-btn { padding:12px 18px; border-radius:12px; font-size:14px; font-weight:700;
      cursor:pointer; border:none; font-family:inherit; transition:all .15s; text-align:center; }
    .confirm-btn:hover { opacity:.85; transform:translateY(-1px); }
    .confirm-btn.primary { background:#111827; color:#FFD600; }
    .confirm-btn.secondary { background:#f3f4f6; color:#374151; }
    .confirm-btn.danger { background:#FCE4EC; color:#C62828; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
 
const API = "https://web-production-32c3f.up.railway.app";
 
const SUPER_COLORS = {
  VEA:       { bg:"#FFD600", text:"#000" },
  Disco:     { bg:"#C8102E", text:"#fff" },
  Carrefour: { bg:"#0066CC", text:"#fff" },
  MasOnline: { bg:"#E4002B", text:"#fff" },
  Dino:      { bg:"#2E7D32", text:"#fff" },
};

const SUPER_VTEX = ["VEA", "Disco", "Carrefour", "MasOnline", "Dino"];

const SUPER_LOGOS = {
  VEA:       "https://veaargentina.vtexassets.com/assets/vtex.file-manager-graphql/images/90afb408-ae59-49dc-93d3-024dfad89cb3___512e889dc7a3dba0a62a4b47dffde6d1.png",
  Disco:     "https://discoargentina.vtexassets.com/assets/vtex.file-manager-graphql/images/bd790034-1117-4263-90e5-04f3f5a27503___ab950355900559ccc0bc0cb131364561.png",
  Carrefour: "https://www.micarrefour.com.ar/images/footer/logo-carrefour-com-ar.svg",
  MasOnline: "https://masonlineprod.vtexassets.com/assets/vtex.file-manager-graphql/images/1f676005-1a66-4379-abe1-e8c39b539f10___3b7e04ce085fbfa38121c0692ad1dd9b.svg",
  Dino:      "https://www.dinoonline.com.ar/super/images/logo-super-mami.png",
};

// Logos alternativos: se prueban en orden si el/los anteriores fallan (ej. Dino
// suele caerse y tirar abajo también las imágenes servidas desde su propio dominio).
const SUPER_LOGOS_FALLBACK = {
  Dino: ["https://statics.dinoonline.com.ar/img/dino-online_sm.png"],
};

function useLogoSources(nombre) {
  const [srcIndex, setSrcIndex] = React.useState(0);
  const sources = React.useMemo(
    () => [SUPER_LOGOS[nombre], ...(SUPER_LOGOS_FALLBACK[nombre] || [])].filter(Boolean),
    [nombre]
  );
  const src = sources[srcIndex] || null;
  const onError = () => setSrcIndex(i => i + 1);
  return { src, onError };
}
 
const BASE_URLS = {
  VEA:       "https://www.vea.com.ar",
  Disco:     "https://www.disco.com.ar",
  Carrefour: "https://www.carrefour.com.ar",
  MasOnline: "https://www.masonline.com.ar",
  Dino:      "https://www.dinoonline.com.ar",
};
 
const CATEGORIAS = {
  "almacen": { label:"Almacén", subs:{ "aceites-y-vinagres":"Aceites y Vinagres","aderezos-salsas-y-especias":"Aderezos, Salsas y Especias","arroz-pastas-y-legumbres":"Arroz, Pastas y Legumbres","caldos-sopas-y-pure":"Caldos, Sopas y Puré","desayuno-y-merienda":"Desayuno y Merienda","enlatados-y-conservas":"Enlatados y Conservas","golosinas-y-chocolates":"Golosinas y Chocolates","harinas":"Harinas","panaderia":"Panadería","reposteria-y-postres":"Repostería y Postres","snacks":"Snacks" } },
  "carnes": { label:"Carnes", subs:{ "carne-vacuna":"Carne Vacuna","carne-cerdo":"Carne Cerdo","pollo":"Pollo","embutidos-y-achuras":"Embutidos y Achuras","carbon-y-lena":"Carbón y Leña" } },
  "bebidas": { label:"Bebidas", subs:{ "aguas":"Aguas","bebidas-blancas-licores-y-whiskys":"Bebidas Blancas, Licores y Whiskys","vinos-y-espumantes":"Vinos y Espumantes","cervezas":"Cervezas","fernet-y-aperitivos":"Fernet y Aperitivos","isotonicas-y-energizantes":"Isotónicas y Energizantes","gaseosas":"Gaseosas","jugos":"Jugos","hielo":"Hielo" } },
  "frutas-verduras-y-huevos": { label:"Frutas, Verduras y Huevos", subs:{ "frutas":"Frutas","frutos-secos":"Frutos Secos","verduras":"Verduras","huevos":"Huevos" } },
  "lacteos-y-frescos": { label:"Lácteos y Frescos", subs:{ "lacteos":"Lácteos","dulces":"Dulces","quesos":"Quesos","fiambres":"Fiambres","pizzas-tapas-y-pastas":"Pizzas, Tapas y Pastas" } },
  "congelados": { label:"Congelados", subs:{ "hamburguesas":"Hamburguesas","helados-y-postres":"Helados y Postres","pescados-y-mariscos":"Pescados y Mariscos","pollo-y-rebozados":"Pollo y Rebozados","papas-y-verduras":"Papas y Verduras","comidas-preparadas":"Comidas Preparadas","frutas-congeladas":"Frutas" } },
  "perfumeria": { label:"Perfumería", subs:{ "cuidado-capilar":"Cuidado Capilar","cuidado-dental":"Cuidado Dental","cuidado-de-la-piel":"Cuidado de la Piel","cuidado-personal":"Cuidado Personal","cuidado-de-la-mujer":"Cuidado de la Mujer","farmacia":"Farmacia" } },
  "limpieza": { label:"Limpieza", subs:{ "accesorios-de-limpieza":"Accesorios de Limpieza","desodorantes-de-ambiente":"Desodorantes de Ambiente","lavandinas":"Lavandinas","limpieza-de-bano":"Limpieza de Baño","limpieza-de-cocina":"Limpieza de Cocina","limpieza-de-hogar":"Limpieza de Hogar","limpieza-de-ropa":"Limpieza de Ropa","insecticidas":"Insecticidas","papeles":"Papeles" } },
  "mundo-bebe": { label:"Mundo Bebé", subs:{ "accesorios-para-bebe":"Accesorios para Bebé","alimentos-y-leches":"Alimentos y Leches","panales-e-higiene":"Pañales e Higiene" } },
  "mascotas": { label:"Mascotas", subs:{ "alimentos":"Alimentos","accesorios-e-higiene":"Accesorios e Higiene" } },
};
 
const CAT_LABELS = Object.fromEntries(Object.entries(CATEGORIAS).map(([k,v]) => [k, v.label]));
const SUBCAT_LABELS = Object.fromEntries(Object.values(CATEGORIAS).flatMap(v => Object.entries(v.subs)));
 
function fmt(n) { return n != null ? "$" + Math.round(n).toLocaleString("es-AR") : "—"; }
 
function relTime(ts) {
  if (!ts) return null;
  const d = new Date(ts.replace(" ","T")), now = new Date();
  const mins = Math.round((now - d) / 60000);
  if (mins < 60) return `hace ${mins}m`;
  if (mins < 1440) return `hace ${Math.round(mins/60)}h`;
  return `hace ${Math.round(mins/1440)}d`;
}
 
function fmtFecha(ts) {
  if (!ts) return "";
  const d = new Date(ts.replace(" ","T"));
  return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit" });
}
 
function SuperLogo({ nombre, size = 22, padding, bare = false, shape = "circle" }) {
  const { src, onError } = useLogoSources(nombre);
  if (!src) return null;
  if (bare) {
    return (
      <img src={src} alt={nombre} loading="lazy" onError={onError}
        style={{width:size, height:size, objectFit:"contain", display:"block", flexShrink:0}}/>
    );
  }
  const pad = padding != null ? padding : Math.round(size * 0.08);
  const cls = shape === "square" ? "super-logo-square" : "super-logo-circle";
  return (
    <span className={cls} style={{width:size, height:size, padding:pad}}>
      <img src={src} alt={nombre} loading="lazy" onError={onError}/>
    </span>
  );
}

function SuperBadge({ nombre, size = 20, fontSize = 10, showText = true, bare = false, shape = "circle" }) {
  const sc = SUPER_COLORS[nombre] || {bg:"#888",text:"#fff"};
  const { src, onError } = useLogoSources(nombre);
  const showLogo = !!src;
  const cls = shape === "square" ? "super-logo-square" : "super-logo-circle";
  return (
    <span style={{display:"inline-flex", alignItems:"center", gap:6}}>
      {showLogo ? (
        bare ? (
          <img src={src} alt={nombre} loading="lazy" onError={onError}
            style={{width:size, height:size, objectFit:"contain", display:"block", flexShrink:0}}/>
        ) : (
          <span className={cls} style={{width:size, height:size, padding:Math.round(size*0.08)}}>
            <img src={src} alt={nombre} loading="lazy" onError={onError}/>
          </span>
        )
      ) : (
        <span className="super-badge" style={{background:sc.bg, color:sc.text, fontSize}}>{nombre}</span>
      )}
      {showLogo && showText && <span style={{fontSize:fontSize+1, fontWeight:800, color:"#374151"}}>{nombre}</span>}
    </span>
  );
}

function promoColor(promo) {
  if (!promo) return "#1565C0";
  if (/\dx\d/.test(promo)) return "#FF6B00";
  if (promo.includes("unidad")) return "#7B1FA2";
  return "#C62828";
}
 
// Sales channel de checkout por supermercado. Los sitios Cencosud tienen el
// sc=1 inactivo — el único activo es el 34 en VEA y el 33 en Disco; con sc=1
// el checkout rechaza todos los ítems con "no encontrado o no disponible".
const VTEX_SALES_CHANNEL = { VEA: 34, Disco: 33 };

function buildVtexCartUrl(superNombre, items) {
  const baseUrl = BASE_URLS[superNombre];
  if (!baseUrl) return null;
  const sc = VTEX_SALES_CHANNEL[superNombre] || 1;
  const params = items
    .filter(i => i.sku_id)
    .map(i => {
      const qtyNum = Number(i.qty);
      const qty = Number.isFinite(qtyNum) && qtyNum > 0 ? qtyNum : 1;
      return `sku=${i.sku_id}&qty=${qty}&seller=1`;
    })
    .join("&");
  if (!params) return null;
  return `${baseUrl}/checkout/cart/add?sc=${sc}&${params}`;
}

function buildDinoCartUrl(producto, cantidad) {
  // Dino (ATG) agrega UN ítem por request; /super/carrito/ lo agrega y muestra
  // el carrito. El url_product_id DEBE llevar el prefijo "prod" (los repository
  // ids de Dino son "prod"+sku): con el sku pelado ATG crea un ítem con
  // referencia rota (sin foto, sin link) que además rompe los agregados
  // posteriores desde la propia página de Dino.
  if (!producto.sku_id) return null;
  const rawId = String(producto.product_id || producto.sku_id);
  const productId = rawId.startsWith("prod") ? rawId : `prod${rawId}`;
  const qtyNum = Number(cantidad);
  const qty = Number.isFinite(qtyNum) && qtyNum > 0 ? qtyNum : 1;
  return `${BASE_URLS.Dino}/super/carrito/?dcs_action=additemtocart&url_catalog_ref_id=${producto.sku_id}&url_product_id=${productId}&url_quantity=${qty}`;
}
 
// ---------------------------------------------------------------------------
// MiniChart
// ---------------------------------------------------------------------------
function MiniChart({ data }) {
  if (!data || data.length < 2) return null;
  const W = 460, H = 140, PAD = { top:10, right:10, bottom:24, left:60 };
  const innerW = W - PAD.left - PAD.right, innerH = H - PAD.top - PAD.bottom;
  const precios = data.map(d => d.precio);
  const minP = Math.min(...precios), maxP = Math.max(...precios), rng = maxP - minP || 1;
  const xStep = innerW / (data.length - 1);
  const toX = i => PAD.left + i * xStep;
  const toY = v => PAD.top + innerH - ((v - minP) / rng) * innerH;
  const points = data.map((d,i) => `${toX(i)},${toY(d.precio)}`).join(" ");
  const areaPoints = [`${toX(0)},${PAD.top + innerH}`, ...data.map((d,i) => `${toX(i)},${toY(d.precio)}`), `${toX(data.length-1)},${PAD.top + innerH}`].join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
      {[0,.5,1].map(t => { const y = PAD.top + innerH*(1-t); return (<g key={t}><line x1={PAD.left} y1={y} x2={W-PAD.right} y2={y} stroke="#f0f0f0" strokeWidth="1"/><text x={PAD.left-6} y={y+4} textAnchor="end" fontSize="10" fill="#9ca3af">${Math.round(minP+rng*t).toLocaleString("es-AR")}</text></g>); })}
      <polygon points={areaPoints} fill="#E91E63" fillOpacity="0.08"/>
      <polyline points={points} fill="none" stroke="#E91E63" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {data.map((d,i) => (<g key={i}><circle cx={toX(i)} cy={toY(d.precio)} r="4" fill="#E91E63"/><text x={toX(i)} y={H-6} textAnchor="middle" fontSize="10" fill="#9ca3af">{fmtFecha(d.scrapeado_en)}</text></g>))}
    </svg>
  );
}

// ---------------------------------------------------------------------------
// Paginacion
// ---------------------------------------------------------------------------
function Paginacion({ paginaActual, totalPaginas, onCambiar }) {
  if (totalPaginas <= 1) return null;
  const [inputVal, setInputVal] = React.useState(String(paginaActual));
  React.useEffect(() => { setInputVal(String(paginaActual)); }, [paginaActual]);
  function irAPagina() { const n = parseInt(inputVal); if (!isNaN(n) && n>=1 && n<=totalPaginas) onCambiar(n); else setInputVal(String(paginaActual)); }
  const items = []; const delta = 2; let prev = null;
  for (let i=1; i<=totalPaginas; i++) {
    if (i===1||i===totalPaginas||(i>=paginaActual-delta&&i<=paginaActual+delta)) { if (prev!==null&&i-prev>1) items.push("..."); items.push(i); prev=i; }
  }
  return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,marginTop:24,flexWrap:"wrap"}}>
      <button className="pill" onClick={()=>onCambiar(paginaActual-1)} disabled={paginaActual===1} style={{padding:"6px 14px",opacity:paginaActual===1?0.4:1}}>← Anterior</button>
      {items.map((item,i) => item==="..."
        ? <span key={"e"+i} style={{color:"#9ca3af",padding:"0 2px"}}>...</span>
        : <button key={item} className={"pill"+(item===paginaActual?" active":"")} onClick={()=>onCambiar(item)} style={{padding:"6px 12px",...(item===paginaActual?{background:"#111827",color:"#fff",border:"none"}:{})}}>{item}</button>
      )}
      <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:4}}>
        <span style={{fontSize:12,color:"#9ca3af"}}>Ir a:</span>
        <input type="number" min="1" max={totalPaginas} value={inputVal}
          onChange={e=>setInputVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&irAPagina()} onBlur={irAPagina}
          style={{width:52,padding:"5px 8px",borderRadius:10,border:"1.5px solid #e0e0e0",fontSize:13,fontWeight:700,textAlign:"center",fontFamily:"inherit",outline:"none"}}/>
        <span style={{fontSize:12,color:"#9ca3af"}}>de {totalPaginas}</span>
      </div>
      <button className="pill" onClick={()=>onCambiar(paginaActual+1)} disabled={paginaActual===totalPaginas} style={{padding:"6px 14px",opacity:paginaActual===totalPaginas?0.4:1}}>Siguiente →</button>
    </div>
  );
}

function AuthModal({ onClose, onLogin }) {
  const [modo, setModo] = React.useState("login");
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [msg, setMsg] = React.useState("");
 
  async function handleSubmit() {
    setError(""); setMsg(""); setLoading(true);
    try {
      const res = await fetch(`${API}/auth/${modo==="login"?"login":"register"}`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,password}) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail||"Error");
      if (modo==="login") { onLogin(data.access_token, data.refresh_token, data.user); onClose(); }
      else { setMsg("¡Registro exitoso! Revisá tu email para confirmar tu cuenta."); setModo("login"); }
    } catch(e) { setError(e.message); }
    setLoading(false);
  }
 
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">{modo==="login"?"Iniciar sesión":"Crear cuenta"}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        {msg && <div style={{background:"#E8F5E9",color:"#2E7D32",padding:"10px 14px",borderRadius:10,marginBottom:12,fontSize:13}}>{msg}</div>}
        {error && <div style={{background:"#FCE4EC",color:"#C62828",padding:"10px 14px",borderRadius:10,marginBottom:12,fontSize:13}}>{error}</div>}
        <input className="auth-input" type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/>
        <input className="auth-input" type="password" placeholder="Contraseña" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
        <button className="auth-btn" onClick={handleSubmit} disabled={loading}>{loading?"Cargando...":modo==="login"?"Iniciar sesión":"Crear cuenta"}</button>
        <div style={{textAlign:"center",marginTop:12}}>
          <button className="auth-link" onClick={()=>{setModo(modo==="login"?"register":"login");setError("");setMsg("");}}>{modo==="login"?"¿No tenés cuenta? Registrate":"¿Ya tenés cuenta? Iniciá sesión"}</button>
        </div>
      </div>
    </div>
  );
}

  const dinoTimerRef = React.useRef(null);

  React.useEffect(() => () => { if (dinoTimerRef.current) clearInterval(dinoTimerRef.current); }, []);

  function handleVaciar() { itemIds.forEach(id => onRemove(id)); onClose(); }

  // Dino no tiene carga batch por URL (ATG procesa un ítem por request), así
  // que abrimos UNA pestaña y la navegamos por cada URL de additemtocart.
  // Asignar location a una ventana cross-origin está permitido; el delay le da
  // tiempo a cada request a impactar antes de la siguiente navegación.
  function cargarDinoAuto() {
    const urls = items.map(i => buildDinoCartUrl(i.producto, i.cantidad)).filter(Boolean);
    if (!urls.length) return;
    const win = window.open(urls[0], "_blank");
    if (!win) return; // popup bloqueado: queda el listado manual como fallback
    setDinoProgress({ actual: 1, total: urls.length });
    let idx = 1;
    dinoTimerRef.current = setInterval(() => {
      if (win.closed) { clearInterval(dinoTimerRef.current); setDinoProgress(null); return; }
      if (idx >= urls.length) { clearInterval(dinoTimerRef.current); setDinoProgress(null); setPaso("listo"); return; }
      win.location = urls[idx];
      idx += 1;
      setDinoProgress({ actual: idx, total: urls.length });

// ---------------------------------------------------------------------------
// SuperSwapButton — cambiar de supermercado manteniendo cantidad
// ---------------------------------------------------------------------------
function SuperSwapButton({ item, onCambiarSuper }) {
  const [open, setOpen] = React.useState(false);
  const [coords, setCoords] = React.useState({ top: 0, left: 0 });
  const btnRef = React.useRef(null);
  const popRef = React.useRef(null);
  const otros = item.producto.otros_supers || [];

  function toggleOpen() {
    if (!open && btnRef.current) {
      const rect = btnRef.current.getBoundingClientRect();
      const left = Math.min(rect.left, window.innerWidth - 216);
      setCoords({ top: rect.bottom + 4, left: Math.max(8, left) });
    }
    setOpen(o => !o);
  }

  React.useEffect(() => {
    if (!open) return;
    function handleClick(e) {
      if (popRef.current && !popRef.current.contains(e.target) &&
          btnRef.current && !btnRef.current.contains(e.target)) setOpen(false);
    }
    function handleCerrar() { setOpen(false); }
    document.addEventListener("mousedown", handleClick);
    window.addEventListener("scroll", handleCerrar, true);
    window.addEventListener("resize", handleCerrar);
    return () => {
      document.removeEventListener("mousedown", handleClick);
      window.removeEventListener("scroll", handleCerrar, true);
      window.removeEventListener("resize", handleCerrar);
    };
  }, [open]);

  if (otros.length === 0) return null;
  const ordenados = [...otros].sort((a, b) => a.precio - b.precio);

  return (
    <div style={{ display: "inline-block", marginTop: 6 }}>
      <button ref={btnRef} onClick={toggleOpen} title="Ver el mismo producto en otros supermercados" style={{
        display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 700,
        color: "#0066CC", background: "none", border: "1.5px solid #cfe0f5", borderRadius: 20,
        padding: "5px 10px", cursor: "pointer", whiteSpace: "nowrap"
      }}>
        🔄 Cambiar de supermercado
      </button>
      {open && ReactDOM.createPortal(
        <div ref={popRef} style={{
          position: "fixed", top: coords.top, left: coords.left, background: "#fff",
          border: "1.5px solid #e0e0e0", borderRadius: 12, boxShadow: "0 8px 28px rgba(0,0,0,.15)",
          zIndex: 1000, minWidth: 200, padding: 6
        }}>
          <div style={{ fontSize: 10, color: "#9ca3af", padding: "4px 8px", fontWeight: 700, textTransform: "uppercase" }}>
            Disponible también en
          </div>
          {ordenados.map(o => {
            const masBarato = o.precio < item.producto.precio;
            return (
              <div key={o.id} onClick={() => { onCambiarSuper(item.producto_id, o.id); setOpen(false); }}
                style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "7px 8px",
                  borderRadius: 8, cursor: "pointer", background: masBarato ? "#E8F5E9" : "transparent"
                }}
                onMouseEnter={e => e.currentTarget.style.background = masBarato ? "#d5ecd7" : "#f5f5f5"}
                onMouseLeave={e => e.currentTarget.style.background = masBarato ? "#E8F5E9" : "transparent"}>
                <SuperBadge nombre={o.supermercado} size={24} bare={true} />
                <span style={{ fontSize: 12, fontWeight: 700, color: "#374151" }}>{o.supermercado}</span>
                <span style={{ fontSize: 12, marginLeft: "auto", fontWeight: 800, color: masBarato ? "#2E7D32" : "#1a1a1a" }}>
                  {fmt(o.precio)}
                </span>
              </div>
            );
          })}
        </div>,
        document.body
      )}
    </div>
  );
}

        <div style={{fontSize:56}}>🛒</div>
        <p style={{fontSize:16,marginTop:12,fontWeight:700,color:"#6b7280"}}>Tu carrito está vacío</p>
        <p style={{fontSize:13,marginTop:6,color:"#9ca3af"}}>Agregá productos con el botón "+ Carrito" en la pestaña de productos</p>
      </div>
    );
  }
 
  // Agrupar por supermercado
  const porSuper = {};
  carritoItems.forEach(item => {
    const prod = item.producto || productosMap[item.producto_id];
    if (!prod) return;
    if (!porSuper[prod.supermercado]) porSuper[prod.supermercado] = [];
    porSuper[prod.supermercado].push({...item, producto: prod});
  });
 
  const hayDino = porSuper["Dino"]?.length > 0;
 
  return (
    <div>
      {selectedProducto && <Modal producto={selectedProducto} onClose={() => setSelectedProducto(null)} />}
      {confirmData && (
        <ConfirmCompraModal
          superNombre={confirmData.superNombre}
          loginUrl={confirmData.loginUrl}
          cartUrl={confirmData.cartUrl}
          itemIds={confirmData.itemIds}
          items={confirmData.items}
          onRemove={onRemove}
          onClose={() => setConfirmData(null)}
          token={token}
        />
      )}
 
      {Object.entries(porSuper).map(([superNombre, items]) => {
        const sc = SUPER_COLORS[superNombre] || {bg:"#888",text:"#fff"};
        const total = items.reduce((acc, i) => acc + (i.producto.precio || 0) * (i.cantidad || 1), 0);
        const esVtex = SUPER_VTEX.includes(superNombre);
        const esDino = superNombre === "Dino";
        const conSku = items.filter(i => i.producto.sku_id);
        const cartUrl = esVtex && !esDino && conSku.length > 0
          ? buildVtexCartUrl(superNombre, conSku.map(i => ({sku_id: i.producto.sku_id, qty: i.cantidad})))
          : null;
        const loginUrl = BASE_URLS[superNombre] || null;
        const puedeComprar = esVtex || esDino;
 
        return (
          <div key={superNombre} className="carrito-super-section">
            <div className="carrito-super-header">
              <div className="carrito-super-title">
                <SuperBadge nombre={superNombre} size={56} fontSize={13}/>
                <span style={{fontSize:13,color:"#6b7280"}}>{items.length} producto{items.length!==1?"s":""}</span>
              </div>
              {(puedeComprar && loginUrl) ? (
                <button
                  className="carrito-comprar-btn"
                  style={{background:sc.bg,color:sc.text}}
                  onClick={() => setConfirmData({
                    superNombre,
                    loginUrl,
                    cartUrl,
                    itemIds: items.map(i => i.producto_id),
                    items
                  })}>
                  Comprar en {superNombre} →
                </button>
              ) : esVtex && conSku.length < items.length ? (
                <span style={{fontSize:11,color:"#9ca3af",fontStyle:"italic"}}>
                  {conSku.length === 0 ? "Sin SKUs — esperá el próximo scrape" : `${conSku.length}/${items.length} con SKU`}
                </span>
              ) : null}
            </div>
 
            {items.map(item => {
              const p = item.producto;
              const cantidad = item.cantidad || 1;
              return (
                <div key={item.producto_id} className="carrito-item">
                  {p.imagen_url
                    ? <img src={p.imagen_url} alt={p.nombre} className="carrito-item-img"/>
                    : <div className="carrito-item-img-placeholder">🛍️</div>}
                  <div className="carrito-item-info">
                    <div
                      className="carrito-item-name"
                      title={p.nombre}
                      style={{cursor:"pointer", textDecoration:"underline dotted", textDecorationColor:"#d1d5db"}}
                      onClick={() => setSelectedProducto(p)}
                    >
                      {p.nombre}
                    </div>
                    <div className="carrito-item-precio">
                      {fmt(p.precio * cantidad)}
                      {cantidad > 1 && <span style={{fontSize:11,color:"#9ca3af",fontWeight:400,marginLeft:6}}>{fmt(p.precio)} c/u</span>}
                      {p.precio_regional && <span style={{fontSize:9,fontWeight:800,color:"#1565C0",background:"#E3F2FD",padding:"2px 6px",borderRadius:8,marginLeft:6}}>📍 tu región</span>}
                    </div>
                    <SuperSwapButton item={item} onCambiarSuper={onCambiarSuper} />
                  </div>
                  <div className="qty-control">
                    <button className="qty-btn" disabled={cantidad <= 1}
                      onClick={() => onUpdateCantidad(item.producto_id, cantidad - 1)}>−</button>
                    <span className="qty-val">{cantidad}</span>
                    <button className="qty-btn" disabled={cantidad >= 99}
                      onClick={() => onUpdateCantidad(item.producto_id, cantidad + 1)}>+</button>
                  </div>
                  {(!esVtex && !esDino) && (
                    <a href={p.url} target="_blank" rel="noopener noreferrer"
                      style={{fontSize:11,color:"#0066CC",fontWeight:700,textDecoration:"none",marginLeft:4,whiteSpace:"nowrap"}}>
                      Ver →
                    </a>
                  )}
                  <button className="carrito-item-remove" onClick={() => onRemove(item.producto_id)} title="Quitar del carrito">✕</button>
                </div>
              );
            })}
 
            <div className="carrito-total">
              <span>Total estimado {superNombre}</span>
              <strong>{fmt(total)}</strong>
            </div>
          </div>
        );
      })}
    </div>
  );
}
// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
// Card memoizada: solo re-renderiza si cambian sus props (producto, estado de
// carrito o handlers). Antes era JSX inline dentro del map de App: cada
// setState del root (cada tecla de búsqueda, abrir un modal) re-renderizaba
// hasta 224 cards completas.
const ProductCard = React.memo(function ProductCard({ p, enCarrito, onFav, onCarrito, onOpen }) {
  const hasOffer = p.descuento_pct || p.promocion;
  const esVtex = SUPER_VTEX.includes(p.supermercado);
  return (
    <div className={`card ${hasOffer?"oferta":""}`} onClick={()=>onOpen(p)}>
      <div className="card-actions">
        <button className="fav-btn" onClick={e=>onFav(e,p.id)} style={{filter:p.favorito?"none":"grayscale(1) opacity(.35)"}}>
          {p.favorito?"❤️":"🤍"}
        </button>
        {(esVtex || p.supermercado === "Dino") && (
          <button className={`cart-btn ${enCarrito?"en-carrito":""}`} onClick={e=>onCarrito(e,p)} title={enCarrito?"Quitar del carrito":"Agregar al carrito"}>
            {enCarrito?"✓ Carrito":"+ Carrito"}
          </button>
        )}
      </div>
      <div className="badges">
        <SuperBadge nombre={p.supermercado} size={40} fontSize={11} bare={true}/>
        <span className="cat-badge">{SUBCAT_LABELS[p.subcategoria]||CAT_LABELS[p.categoria]||p.categoria}</span>
        {p.scrapeado_en&&<span className="time-badge">{relTime(p.scrapeado_en)}</span>}
      </div>
      {p.imagen_url&&<img src={p.imagen_url} alt={p.nombre} loading="lazy" style={{width:"100%",height:"140px",objectFit:"contain",borderRadius:"8px",background:"#f9f9f9"}}/>}
      <div className="product-name">{p.nombre}</div>
      <div className="prices">
        <span className={`price ${hasOffer?"oferta":"normal"}`}>{fmt(p.precio)}</span>
        {p.precio_original&&<span className="price-original">{fmt(p.precio_original)}</span>}
        {p.descuento_pct&&!p.promocion&&<span className="discount">-{p.descuento_pct}%</span>}
        {p.precio_regional&&<span style={{fontSize:9,fontWeight:800,color:"#1565C0",background:"#E3F2FD",padding:"2px 7px",borderRadius:10}}>📍 tu región</span>}
      </div>
      {p.promocion&&<span className="promo" style={{background:promoColor(p.promocion)}}>{p.promocion}</span>}
      {p.otros_supers&&p.otros_supers.length>0&&(()=>{
        const ordenados=[...p.otros_supers].sort((a,b)=>a.precio-b.precio);
        return (<div style={{marginTop:6,display:"flex",flexDirection:"column",gap:4}}>
          {ordenados.map((o,i)=>{
            const esMasBarato=o.precio<p.precio;
            const osc=SUPER_COLORS[o.supermercado]||{bg:"#888",text:"#fff"};
            return (<a key={o.supermercado} href={o.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:11,textDecoration:"none",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 8px",borderRadius:8,background:esMasBarato?"#E8F5E9":"#f9f9f9",border:esMasBarato?"1px solid #A5D6A7":"1px solid #ebebeb"}}>
              <span style={{fontWeight:700,color:osc.bg==="FFD600"?"#b8860b":osc.bg}}>{i===0&&esMasBarato?"💚 ":""}{o.supermercado}</span>
              <span style={{fontWeight:700,color:esMasBarato?"#2E7D32":"#555"}}>{fmt(o.precio)}</span>
            </a>);
          })}
        </div>);
      })()}
    </div>
  );
});

function App() {
  const [productos, setProductos] = React.useState([]);
  const [stats, setStats] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [tab, setTab] = React.useState("todos");
  const [superFiltro, setSuperFiltro] = React.useState("Todos");
  const [catFiltro, setCatFiltro] = React.useState("Todas");
  const [subcatFiltro, setSubcatFiltro] = React.useState("Todas");
  const [soloOfertas, setSoloOfertas] = React.useState(false);
  const [orden, setOrden] = React.useState("popular");
  const [busqueda, setBusqueda] = React.useState("");
  const [modalProducto, setModalProducto] = React.useState(null);
  const [porPagina, setPorPagina] = React.useState(28);
  const [pagina, setPagina] = React.useState(1);
  const [totalProductos, setTotalProductos] = React.useState(0);
  const [totalPaginas, setTotalPaginas] = React.useState(1);
  const [usuario, setUsuario] = React.useState(() => { try { return JSON.parse(localStorage.getItem("sp_user")); } catch { return null; } });
  const [token, setToken] = React.useState(() => localStorage.getItem("sp_token") || null);
  const [showAuth, setShowAuth] = React.useState(false);
  const [carritoItems, setCarritoItems] = React.useState([]);
  const [productosMap, setProductosMap] = React.useState({});
  const [regiones, setRegiones] = React.useState([]);
  const [regionId, setRegionId] = React.useState(() => {
    const saved = localStorage.getItem("sp_region");
    return saved ? Number(saved) : null;
  });
 
  React.useEffect(() => {
    fetch(`${API}/regiones`).then(r => r.json())
      .then(data => { if (Array.isArray(data)) setRegiones(data); })
      .catch(() => {});
  }, []);
 
  function cambiarRegion(id) {
    setRegionId(id);
    if (id) localStorage.setItem("sp_region", id);
    else localStorage.removeItem("sp_region");
    if (token) {
      fetch(`${API}/preferencia`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ region_id: id })
      }).catch(() => {});
    }
  }
 
  function handleLogin(access_token, refresh_token, user) {
    setToken(access_token); setUsuario(user);
    localStorage.setItem("sp_token", access_token);
    localStorage.setItem("sp_refresh", refresh_token||"");
    localStorage.setItem("sp_user", JSON.stringify(user));
  }
  function handleLogout() {
    setToken(null); setUsuario(null); setCarritoItems([]); setProductosMap({});
    localStorage.removeItem("sp_token"); localStorage.removeItem("sp_refresh"); localStorage.removeItem("sp_user");
  }
 
  // Auto-refresh token
  React.useEffect(() => {
    if (!token) return;
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
      const expiresIn = payload.exp*1000 - Date.now() - 5*60*1000;
      if (expiresIn <= 0) { refreshToken(); return; }
      const timer = setTimeout(refreshToken, expiresIn);
      return () => clearTimeout(timer);
    } catch(e) {}
  }, [token]);
 
  async function refreshToken() {
    const refresh = localStorage.getItem("sp_refresh");
    if (!refresh) { handleLogout(); return; }
    try {
      const res = await fetch(`${API}/auth/refresh`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({refresh_token:refresh}) });
      if (!res.ok) { handleLogout(); return; }
      const data = await res.json();
      setToken(data.access_token);
      localStorage.setItem("sp_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("sp_refresh", data.refresh_token);
    } catch(e) { handleLogout(); }
  }
 
  function cargarCarrito() {
    if (!token) return;
    const qs = regionId ? `?region_id=${regionId}` : "";
    fetch(`${API}/carrito${qs}`, { headers:{Authorization:`Bearer ${token}`} })
      .then(r => r.json())
      .then(data => {
        if (!Array.isArray(data)) return;
        setCarritoItems(data);
        setProductosMap(prev => {
          const next = {...prev};
          data.forEach(i => { if (i.producto) next[i.producto_id] = i.producto; });
          return next;
        });
      })
      .catch(() => {});
  }
 
  React.useEffect(() => {
    if (!token) { setCarritoItems([]); return; }
    cargarCarrito();
    // La región guardada en el backend prevalece sobre localStorage al loguearse.
    fetch(`${API}/preferencia`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
        if (data && data.region_id) {
          setRegionId(data.region_id);
          localStorage.setItem("sp_region", data.region_id);
        }
      })
      .catch(() => {});
  }, [token]);
 
  React.useEffect(() => {
    if (token && tab === "carrito") cargarCarrito();
  }, [tab, regionId]);
 
  // Enriquecer productosMap con productos cargados
  React.useEffect(() => {
    if (productos.length > 0) {
      setProductosMap(prev => { const next={...prev}; productos.forEach(p => { next[p.id]=p; }); return next; });
    }
  }, [productos]);
 
  const cargarRef = React.useRef(null);
 
  async function cargar(paginaOverride) {
    if (cargarRef.current) cargarRef.current.abort();
    const controller = new AbortController();
    cargarRef.current = controller;
    const signal = controller.signal;
    setLoading(true);
    const paginaActual = paginaOverride !== undefined ? paginaOverride : pagina;
    const params = new URLSearchParams();
    if (superFiltro !== "Todos") params.append("supermercado", superFiltro);
    if (catFiltro !== "Todas") params.append("categoria", catFiltro);
    if (subcatFiltro !== "Todas") params.append("subcategoria", subcatFiltro);
    if (soloOfertas) params.append("ofertas", "true");
    if (tab === "favoritos") params.append("favoritos", "true");
    if (busqueda) params.append("busqueda", busqueda);
    params.append("pagina", paginaActual);
    params.append("por_pagina", porPagina);
    params.append("orden", orden);
    if (regionId) params.append("region_id", regionId);
    try {
      const headers = token ? {Authorization:`Bearer ${token}`} : {};
      // /stats ya no se pide acá: casi no cambia y se estaba refetcheando en
      // cada cambio de filtro/página/búsqueda. Ahora tiene su propio efecto.
      const resp = await fetch(`${API}/productos?${params}`, {signal, headers}).then(r=>r.json());
      if (signal.aborted) return;
      const prods = resp.productos || [];
      setProductos(Array.isArray(prods)?prods:[]);
      setTotalProductos(resp.total||0);
      setTotalPaginas(resp.total_paginas||1);
    } catch(e) { if (e.name==="AbortError") return; }
    setLoading(false);
  }

  // Stats: una vez al montar y cuando cambia la sesión (el toggle de favoritos
  // ya lo refetchea por su cuenta al modificar el contador).
  React.useEffect(() => {
    const headers = token ? {Authorization:`Bearer ${token}`} : {};
    fetch(`${API}/stats`, {headers}).then(r=>r.json()).then(st=>setStats(st)).catch(()=>{});
  }, [token]);
 
  React.useEffect(() => {
    if (tab === "carrito") return;
    setPagina(1);
    const t = setTimeout(() => cargar(1), busqueda?400:0);
    return () => clearTimeout(t);
  }, [tab, superFiltro, catFiltro, subcatFiltro, soloOfertas, busqueda, token, orden, porPagina, regionId]);
 
  // useCallback: identidad estable para que React.memo(ProductCard) evite
  // re-renderizar hasta 224 cards en cada tecla de búsqueda / setState del root.
  const toggleFav = React.useCallback(async (e, id) => {
    e.stopPropagation();
    if (!token) { setShowAuth(true); return; }
    setProductos(prev => prev.map(p => p.id===id ? {...p, favorito:!p.favorito} : p));
    const res = await fetch(`${API}/productos/${id}/favorito`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    const data = await res.json().catch(()=>({}));
    if (data.favorito !== undefined) setProductos(prev => prev.map(p => p.id===id ? {...p, favorito:data.favorito} : p));
    fetch(`${API}/stats`, {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).then(st=>setStats(st)).catch(()=>{});
  }, [token]);

  const toggleCarrito = React.useCallback(async (e, producto) => {
    e.stopPropagation();
    if (!token) { setShowAuth(true); return; }
    const yaEsta = carritoItems.some(i => i.producto_id === producto.id);
    // Optimistic update
    if (yaEsta) {
      setCarritoItems(prev => prev.filter(i => i.producto_id !== producto.id));
    } else {
      setCarritoItems(prev => [...prev, {producto_id:producto.id, cantidad:1}]);
      setProductosMap(prev => ({...prev, [producto.id]: producto}));
    }
    try {
      await fetch(`${API}/carrito/${producto.id}`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    } catch(err) {
      // Revertir si falla
      if (yaEsta) setCarritoItems(prev => [...prev, {producto_id:producto.id, cantidad:1}]);
      else setCarritoItems(prev => prev.filter(i => i.producto_id !== producto.id));
    }
  }, [token, carritoItems]);
 
  async function removeDelCarrito(producto_id) {
    setCarritoItems(prev => prev.filter(i => i.producto_id !== producto_id));
    try {
      await fetch(`${API}/carrito/${producto_id}`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    } catch(err) {}
  }
 
  async function updateCantidad(producto_id, cantidad) {
    setCarritoItems(prev => prev.map(i => i.producto_id === producto_id ? {...i, cantidad} : i));
    try {
      await fetch(`${API}/carrito/${producto_id}`, {
        method: "PUT",
        headers: {Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
        body: JSON.stringify({cantidad})
      });
    } catch(err) {
      // Revertir si falla — recargamos desde el backend
      fetch(`${API}/carrito`, {headers:{Authorization:`Bearer ${token}`}})
        .then(r => r.json()).then(data => { if (Array.isArray(data)) setCarritoItems(data); }).catch(()=>{});
    }
  }
 
  async function cambiarSuper(producto_id, nuevo_producto_id) {
    const anterior = carritoItems;
    setCarritoItems(prev => prev.map(i => i.producto_id === producto_id ? { ...i, producto_id: nuevo_producto_id } : i));
    try {
      const res = await fetch(`${API}/carrito/${producto_id}/cambiar-super`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ nuevo_producto_id })
      });
      if (!res.ok) throw new Error();
      cargarCarrito(); // trae nombre/imagen/precio/otros_supers completos del nuevo producto
    } catch (err) {
      setCarritoItems(anterior);
    }
  }

  function cambiarPagina(p) { setPagina(p); cargar(p); window.scrollTo({top:0,behavior:"smooth"}); }
  function cambiarPorPagina(val) { setPorPagina(val); setPagina(1); }
  function handleCatFiltro(cat) { setCatFiltro(cat); setSubcatFiltro("Todas"); }
 
  const supers = ["Todos","VEA","Disco","Carrefour","MasOnline","Dino"];
  const cats = ["Todas", ...Object.keys(CATEGORIAS)];
  const subcats = catFiltro!=="Todas"&&CATEGORIAS[catFiltro] ? ["Todas",...Object.keys(CATEGORIAS[catFiltro].subs)] : [];
  const totalCarrito = carritoItems.length;
 
  return (
    <div>
      {showAuth && <AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin}/>}
      {modalProducto && <Modal producto={modalProducto} onClose={()=>setModalProducto(null)}/>}
 
      <div className="header">
        <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
          <div>
            <h1 style={{cursor:"pointer"}} onClick={()=>{setTab("todos");setSuperFiltro("Todos");setCatFiltro("Todas");setSubcatFiltro("Todas");setBusqueda("");setSoloOfertas(false);window.scrollTo({top:0,behavior:"smooth"});}}>🛒 <span>Super</span>Precios AR</h1>
          </div>
          <div className="header-logos">
            {["VEA","Disco","Carrefour","MasOnline","Dino"].map(s => (
              <SuperLogo key={s} nombre={s} size={80} padding={s === "VEA" ? 10 : 3} shape="square"/>
            ))}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {regiones.length > 0 && (
            <select value={regionId||""} onChange={e=>cambiarRegion(e.target.value?Number(e.target.value):null)}
              title="Ver precios de tu región (por ahora, Carrefour)"
              style={{fontSize:12,padding:"6px 10px",borderRadius:8,border:"1px solid #374151",background:"#1f2937",color:"#fff",cursor:"pointer",outline:"none",fontFamily:"inherit"}}>
              <option value="">📍 Sin región (precio general)</option>
              {regiones.map(r => <option key={r.id} value={r.id}>📍 {r.nombre}</option>)}
            </select>
          )}
          {usuario ? (
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:12,color:"#9ca3af"}}>{usuario.email}</span>
              <button onClick={handleLogout} style={{fontSize:11,padding:"4px 10px",borderRadius:8,border:"1px solid #374151",background:"none",color:"#9ca3af",cursor:"pointer"}}>Salir</button>
            </div>
          ) : (
            <button onClick={()=>setShowAuth(true)} style={{fontSize:12,padding:"6px 14px",borderRadius:8,border:"none",background:"#FFD600",color:"#000",fontWeight:700,cursor:"pointer"}}>Iniciar sesión</button>
          )}
          <div className="stats">
            <div className="stat" style={{cursor:"pointer"}} onClick={()=>{setTab("todos");setSuperFiltro("Todos");setCatFiltro("Todas");setSubcatFiltro("Todas");setBusqueda("");setSoloOfertas(false);window.scrollTo({top:0,behavior:"smooth"});}}>
              <div className="stat-val" style={{color:"#FFD600"}}>{stats.total_productos||0}</div>
              <div className="stat-lbl">Productos</div>
            </div>
            <div className="stat" style={{cursor:"pointer"}} onClick={()=>{if(!token){setShowAuth(true);return;}setTab("favoritos");window.scrollTo({top:0,behavior:"smooth"});}}>
              <div className="stat-val" style={{color:"#4CAF50"}}>{stats.favoritos||0}</div>
              <div className="stat-lbl">Favoritos</div>
            </div>
            <div className="stat" style={{cursor:"pointer"}} onClick={()=>{if(!token){setShowAuth(true);return;}setTab("carrito");window.scrollTo({top:0,behavior:"smooth"});}}>
              <div className="stat-val" style={{color:"#FFD600"}}>{totalCarrito}</div>
              <div className="stat-lbl">Carrito</div>
            </div>
          </div>
        </div>
      </div>
 
      <div className="container">
        <div className="tabs">
          {[["todos","Todos los productos"],["favoritos","Mis favoritos"],["carrito","Mi carrito"]].map(([key,label]) => (
            <button key={key} className={`tab ${tab===key?"active":""}`}
              onClick={()=>{ if((key==="favoritos"||key==="carrito")&&!token){setShowAuth(true);return;} setTab(key); }}>
              {label}
              {key==="favoritos"&&stats.favoritos>0&&<span style={{marginLeft:6,background:"#E91E63",color:"#fff",borderRadius:10,fontSize:10,padding:"1px 6px"}}>{stats.favoritos}</span>}
              {key==="carrito"&&totalCarrito>0&&<span style={{marginLeft:6,background:"#FFD600",color:"#000",borderRadius:10,fontSize:10,padding:"1px 6px",fontWeight:900}}>{totalCarrito}</span>}
            </button>
          ))}
        </div>
 
        {tab === "carrito" ? (
          <CarritoView carritoItems={carritoItems} productosMap={productosMap} onRemove={removeDelCarrito} onUpdateCantidad={updateCantidad} onCambiarSuper={cambiarSuper} token={token}/>
        ) : (
          <>
            <div className="search">
              <span>🔍</span>
              <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar producto en todos los supermercados..."/>
            </div>
 
            <div className="filters">
              <div className="filter-row">
                <span className="filter-label">Supermercado</span>
                {supers.map(s => { const c=SUPER_COLORS[s]; return (<button key={s} className={`pill ${superFiltro===s?"active":""}`} style={superFiltro===s?{background:c?.bg||"#1a1a1a",color:c?.text||"#fff"}:{}} onClick={()=>setSuperFiltro(s)}>{s}</button>); })}
              </div>
              <div className="filter-row">
                <span className="filter-label">Categoría</span>
                {cats.map(c => (<button key={c} className={`pill ${catFiltro===c?"active":""}`} style={catFiltro===c?{background:"#1a1a1a",color:"#fff"}:{}} onClick={()=>handleCatFiltro(c)}>{CAT_LABELS[c]||"Todas"}</button>))}
              </div>
              {subcats.length > 0 && (
                <div className="filter-row">
                  <span className="filter-label">Subcategoría</span>
                  <select value={subcatFiltro} onChange={e=>setSubcatFiltro(e.target.value)}
                    style={{padding:"6px 12px",borderRadius:24,fontSize:12.5,fontWeight:700,border:"1.5px solid #e0e0e0",background:"#fff",color:"#555",cursor:"pointer",outline:"none",fontFamily:"inherit"}}>
                    {subcats.map(s => (<option key={s} value={s}>{s==="Todas"?"Todas las subcategorías":SUBCAT_LABELS[s]||s}</option>))}
                  </select>
                </div>
              )}
              <div className="filter-row">
                <span className="filter-label">Ordenar por</span>
                {[["popular","Más populares"],["precio-asc","Precio ↑"],["precio-desc","Precio ↓"],["descuento","Mayor descuento"],["reciente","Más reciente"]].map(([key,label]) => (
                  <button key={key} className={`pill ${orden===key?"active":""}`} style={orden===key?{background:"#1a1a1a",color:"#fff"}:{}} onClick={()=>setOrden(key)}>{label}</button>
                ))}
              </div>
              <div className="filter-row">
                <span className="filter-label">Ofertas</span>
                <div onClick={()=>setSoloOfertas(!soloOfertas)} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:soloOfertas?"#FCE4EC":"#f5f5f5",border:soloOfertas?"1.5px solid #E91E63":"1.5px solid #e0e0e0",borderRadius:24,padding:"6px 14px",transition:"all .2s"}}>
                  <div style={{width:36,height:20,borderRadius:10,position:"relative",background:soloOfertas?"#E91E63":"#ccc",transition:"background .2s"}}>
                    <div style={{position:"absolute",top:2,left:soloOfertas?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/>
                  </div>
                  <span style={{fontSize:12.5,fontWeight:700,color:soloOfertas?"#E91E63":"#555"}}>Solo ofertas y promos</span>
                </div>
              </div>
            </div>
 
            <div className="result-count" style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <span>{loading?"Cargando...":`${totalProductos} producto${totalProductos!==1?"s":""} · página ${pagina} de ${totalPaginas}`}</span>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:"#9ca3af"}}>Por página:</span>
                {[[28,"28"],[56,"56"],[112,"112"],[224,"224"]].map(([val,label]) => (
                  <button key={val} onClick={()=>cambiarPorPagina(val)} className={`pill ${porPagina===val?"active":""}`} style={{padding:"3px 10px",fontSize:11,...(porPagina===val?{background:"#1a1a1a",color:"#fff",border:"none"}:{})}}>{label}</button>
                ))}
              </div>
            </div>
 
            {productos.length===0&&!loading ? (
              <div className="empty"><div>🧐</div><p style={{fontSize:16,marginTop:12}}>No hay productos con esos filtros</p></div>
            ) : (
              <>
                <div className="grid">
                  {productos.map(p => (
                    <ProductCard
                      key={p.id}
                      p={p}
                      enCarrito={carritoItems.some(i => i.producto_id===p.id)}
                      onFav={toggleFav}
                      onCarrito={toggleCarrito}
                      onOpen={setModalProducto}
                    />
                  ))}
                </div>
                <Paginacion paginaActual={pagina} totalPaginas={totalPaginas} onCambiar={cambiarPagina}/>
              </>
            )}
 
            <div className="footer">
              <strong>Actualización automática:</strong> todos los días a las 06:00 y 18:00 hs.
              Tocá ❤️ para agregar a favoritos (te avisamos si baja el precio).
              Tocá "+ Carrito" para armar tu compra y ejecutarla directo en el supermercado.
            </div>
          </>
        )}
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
