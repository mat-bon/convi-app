                <th key={s} className="cr-th-super">
                  {/* Cordiez es un wordmark metido en un lienzo cuadrado con
                      relleno arriba y abajo: con `size` sale diminuto porque el
                      alto se lo come el aire. Necesita `recorte`, igual que en
                      el marquee. */}
                  {s === "Cordiez"
                    ? <SuperLogo nombre={s} ancho={76} recorte={4.3} bare={true}/>
                    : <SuperLogo nombre={s} size={26} ancho="auto" maxAncho={84} bare={true}/>}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {semana.map(f => (
              <tr key={f.dia} className={f.dia === hoy ? "cr-hoy" : ""}>
                <th className="cr-th-dia">
                  <span className="cr-dia-largo">{DIAS_NOMBRE[f.dia-1]}</span>
                  <span className="cr-dia-corto">{DIAS_CORTO[f.dia-1]}</span>
                  {f.dia === hoy && <span className="cr-hoy-tag">hoy</span>}
                </th>
                {supers.map(s => (
                  <CronogramaCelda key={s} celda={f.celdas[s]} onVer={setDetalle}/>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {supers.length === 0 && (
        <div className="cr-estado">Todavía no tenemos promos cargadas para tu región.</div>
      )}

      <p className="cr-nota">
        Los porcentajes son los que publica cada cadena. El tope, las exclusiones y si es
        descuento o reintegro están en el detalle de cada celda — tocala para verlo.
        {!token && <> Si <button className="cr-link" onClick={onPedirCuenta}>creás una cuenta</button> y
        cargás tus tarjetas, calculamos cuánto ahorrás sobre tu lista real.</>}
      </p>

      {/* Modal propio y no el componente `Modal`, que es de producto y sale a
          pedir el historial de precios apenas monta. */}
      {detalle && (
        <div className="modal-overlay" onClick={()=>setDetalle(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Promos de esta celda</div>
              <button className="modal-close" onClick={()=>setDetalle(null)}>✕</button>
            </div>
            <div className="modal-body cr-detalle">
              {detalle.promos.map((p, i) => (
                <div key={i} className="cr-detalle-item">
                  <div className="cr-detalle-top">
                    <PagoLogo nombre={p.entidad} size={22}/>
                    <strong>{p.entidad}</strong>
                    <span className="cr-detalle-pct">{p.pct}%</span>
                  </div>
                  <ul>
                    <li>{p.tipo === "reintegro"
                          ? "Reintegro: pagás el total y te lo devuelven después."
                          : "Descuento directo en la caja."}</li>
                    {p.canal === "sucursal" && <li>Sólo en sucursal física.</li>}
                    {p.canal === "online" && <li>Sólo comprando online.</li>}
                    {p.tope && <li>Tope de ahorro: {fmt(p.tope)} {p.tope_periodo || ""}.</li>}
                    {p.compra_minima && <li>Compra mínima: {fmt(p.compra_minima)}.</li>}
                    {p.membresia && <li>Sólo para clientes {p.membresia}.</li>}
                    {p.excluye && <li>No aplica a todo el carrito: la cadena excluye rubros.</li>}
                    {p.detalle && <li className="cr-detalle-legal">{p.detalle}</li>}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// MediosPagoModal — qué tarjetas/billeteras tiene el usuario
// ---------------------------------------------------------------------------
// El catálogo sale de las promos activas y no de una tabla fija: si una entidad
// no tiene promo en ningún súper, tildarla no cambiaría ningún total y sólo
// haría más larga la lista.
function MediosPagoModal({ token, onClose, onGuardado }) {
  const [entidades, setEntidades] = React.useState([]);
  const [elegidas, setElegidas]   = React.useState(null);   // null = todavía cargando
  const [tramos, setTramos]       = React.useState({});     // {entidad: [categoría]}
  const [guardando, setGuardando] = React.useState(false);

  React.useEffect(() => {
    Promise.all([
      fetch(`${API}/medios-pago`).then(r => r.json()),
      fetch(`${API}/mis-medios-pago`, { headers: { Authorization: `Bearer ${token}` } }).then(r => r.json()),
    ])
      .then(([cat, mias]) => {
        setEntidades(cat.entidades || []);
        setElegidas(new Set(mias.entidades || []));
        setTramos(mias.membresias || {});
      })
      .catch(() => { setEntidades([]); setElegidas(new Set()); setTramos({}); });
  }, [token]);

  function toggle(ent) {
    const estaba = elegidas.has(ent);
    setElegidas(prev => {
      const s = new Set(prev);
      estaba ? s.delete(ent) : s.add(ent);
      return s;
    });
    // Destildar el banco se lleva su categoría: si no, volver a tildarlo
    // reviviría un escalón viejo que el usuario ya no está mirando.
    if (estaba) setTramos(prev => { const n = { ...prev }; delete n[ent]; return n; });
  }

  function toggleTramo(ent, cat) {
    setTramos(prev => {
      const actuales = prev[ent] || [];
      return { ...prev, [ent]: actuales.includes(cat)
        ? actuales.filter(c => c !== cat)
        : [...actuales, cat] };
    });
  }

  async function guardar() {
    setGuardando(true);
    try {
      await fetch(`${API}/mis-medios-pago`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ entidades: [...elegidas], membresias: tramos }),
      });
      onGuardado([...elegidas]);
      onClose();
    } catch (e) {
      setGuardando(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">💳 Mis medios de pago</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <p style={{fontSize:12.5,color:"var(--text-secondary)",lineHeight:1.6,marginBottom:14}}>
            Tildá los bancos, billeteras y tarjetas que usás. Con eso calculamos cuánto te
            sale <strong>a vos</strong> la lista en cada súper, con los descuentos del día aplicados.
            Donde el banco dé distinto descuento según el tipo de cliente, elegí también tu categoría.
          </p>

          {elegidas === null ? (
            <p style={{fontSize:13,color:"var(--text-muted)"}}>Cargando…</p>
          ) : entidades.length === 0 ? (
            <p style={{fontSize:13,color:"var(--text-muted)"}}>No hay promociones cargadas por ahora.</p>
          ) : (
            <div className="mp-lista">
              {entidades.map(e => {
                // `sin_requisito` no es una opción sino un hecho: la promo
                // aplica pagues como pagues, así que va tildada y no se puede
                // destildar — destildarla solo serviría para esconderse un
                // descuento propio. El motor la aplica igual (no depende de lo
                // que se guarde acá), pero si la pantalla la mostrara en blanco
                // parecería que falta tildar algo para tenerla.
                const fija  = !!e.sin_requisito;
                const on    = fija || elegidas.has(e.entidad);
                const mias  = tramos[e.entidad] || [];
                // Varios bancos dan distinto descuento según la categoría del
                // cliente. Los chips aparecen sólo con el banco tildado: si no,
                // la lista entera se llena de opciones que no vienen al caso.
                const hayCat = on && e.membresias.length > 0;
                return (
                  <div key={e.entidad} className={`mp-item ${on ? "on" : ""} ${fija ? "fija" : ""}`}>
                    <button className="mp-item-head" disabled={fija}
                            title={fija ? "Aplica con cualquier medio de pago: no hay nada que tildar" : undefined}
                            onClick={() => { if (!fija) toggle(e.entidad); }}>
                      <span className="mp-item-check">{on ? "✓" : ""}</span>
                      <PagoLogo nombre={e.entidad}/>
                      <span style={{minWidth:0}}>
                        <span className="mp-item-nombre">{e.entidad}</span>
                        <div className="mp-item-supers">
                          {e.supers.join(" · ")}
                          {fija
                            ? <> — <strong>siempre aplicado</strong>, pagues como pagues</>
                            : !on && e.membresias.length > 0 && <> — con categorías</>}
                        </div>
                      </span>
                    </button>
                    {hayCat && (
                      <div className="mp-tramos">
                        <div className={`mp-tramos-tit ${
                              e.solo_con_membresia && mias.length === 0 ? "obligatoria" : ""}`}>
                          {e.solo_con_membresia
                            ? "Acá todos los descuentos dependen de la categoría — sin elegirla no podemos calcularlos."
                            : "¿Tenés alguna de estas? Suelen tener más descuento."}
                        </div>
                        <div className="mp-tramos-chips">
                          {e.membresias.map(cat => (
                            <button key={cat}
                              className={`mp-tramo ${mias.includes(cat) ? "on" : ""}`}
                              onClick={() => toggleTramo(e.entidad, cat)}>
                              {mias.includes(cat) ? "✓ " : ""}{cat}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <button className="mp-save" disabled={guardando || elegidas === null} onClick={guardar}>
            {guardando ? "Guardando…" : "Guardar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// ListaView — grilla producto x supermercado
// ---------------------------------------------------------------------------
// Una fila por producto, una columna por súper. Las columnas vienen ordenadas
// del backend: primero los que tienen la lista completa, después por cuántos
// productos les faltan, y recién ahí por precio.
function ListaView({ token, regionId, regionCodigo, supersVisibles, listas, listaActivaId,
                     setListaActivaId, onListasChange, carritoIds, onCarritoChange }) {
  const [data, setData]         = React.useState(null);
  const [cargando, setCargando] = React.useState(true);
  const [error, setError]       = React.useState(null);
  const [ocupado, setOcupado]   = React.useState(null);
  const [aviso, setAviso]       = React.useState(null);
  const [showPagos, setShowPagos] = React.useState(false);
  const [misPagos, setMisPagos]   = React.useState([]);
  const [ficha, setFicha]         = React.useState(null);

  // Ficha del producto de una fila de la lista, con la MISMA forma que espera
  // <Modal> en la pestaña de productos. Se arma con lo que ya trajo /comparar
  // en vez de pedirla a la API: la comparación ya tiene el precio de cada
  // súper, que es justo lo que el modal muestra en "en otros supermercados".
  //
  // Se toma el súper más barato como el "principal" —es el que la fila
  // destaca— y el resto va como otros_supers. Lo que no viene en /comparar y
  // el modal sí muestra en la pestaña de productos (descuento, promo,
  // categoría) queda afuera: el modal ya los renderiza condicionalmente, así
  // que simplemente no aparecen. El historial sí funciona, que es lo que más
  // se busca al abrir la ficha, porque va por producto_id.
  const fichaDe = (fila) => {
    const principal = fila.mas_barato && fila.precios[fila.mas_barato];
    if (!principal) return null;   // fila sin precio en ningún súper
    return {
      id:              principal.producto_id,
      nombre:          fila.nombre,
      imagen_url:      fila.imagen_url,
      supermercado:    fila.mas_barato,
      precio:          principal.precio,
      precio_regional: principal.precio_regional,
      url:             principal.url,
      sku_id:          principal.sku_id,
      otros_supers: Object.entries(fila.precios)
        .filter(([nombre]) => nombre !== fila.mas_barato)
        .map(([nombre, c]) => ({
          supermercado: nombre, precio: c.precio,
          id: c.producto_id, url: c.url, sku_id: c.sku_id,
        })),
    };
  };

  const abrirFicha = (fila) => {
    const f = fichaDe(fila);
    if (f) setFicha(f);
  };

  const supersKey = supersVisibles.join(",");

  // El backend ya usa los medios de pago guardados sin que se los mandemos; esto
  // es sólo para el contador del botón y para saber si hay que invitar a cargarlos.
  React.useEffect(() => {
    if (!token) { setMisPagos([]); return; }
    fetch(`${API}/mis-medios-pago`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(d => setMisPagos(d.entidades || []))
      .catch(() => {});
  }, [token]);

  const cargar = React.useCallback(() => {
    if (!token || !listaActivaId) { setData(null); setCargando(false); return; }
    const params = new URLSearchParams();
    if (regionId) params.append("region_id", regionId);
    // Las columnas son los supers que el usuario tiene tildados en el filtro.
    // Si están todos, no mandamos nada y el backend usa el universo completo.
    const elegidos = supersKey ? supersKey.split(",") : [];
    if (elegidos.length && elegidos.length < SUPER_TODOS.length) {
      params.append("supermercados", supersKey);
    }
    fetch(`${API}/listas/${listaActivaId}/comparar?${params}`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(d => { setData(d); setError(null); })
      .catch(() => setError("No pudimos cargar la comparación de la lista"))
      .finally(() => setCargando(false));
  }, [token, listaActivaId, regionId, supersKey]);

  React.useEffect(() => { setCargando(true); cargar(); }, [cargar]);

  const authJson = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };

  async function cambiarCantidad(item, cantidad) {
    if (cantidad < 1 || cantidad > 99) return;
    // Optimista sobre el número; los totales los recalcula el backend al releer
    // (replicar acá la lógica de estimación sería duplicarla y desincronizarla).
    setData(d => d && ({ ...d, items: d.items.map(i => i.id === item.id ? { ...i, cantidad } : i) }));
    try {
      await fetch(`${API}/listas/${listaActivaId}/items/${item.id}`, {
        method: "PUT", headers: authJson, body: JSON.stringify({ cantidad }),
      });
    } catch (e) {}
    cargar();
  }

  async function quitar(item) {
    setData(d => d && ({ ...d, items: d.items.filter(i => i.id !== item.id) }));
    try {
      await fetch(`${API}/listas/${listaActivaId}/items/${item.id}`, {
        method: "DELETE", headers: { Authorization: `Bearer ${token}` },
      });
    } catch (e) {}
    cargar(); onListasChange();
  }

  // Celda tocable: agrega ESE producto de ESE súper al carrito, y si ya estaba
  // lo saca. Son dos endpoints distintos a propósito:
  //   alta  — `desde-lista`, que desplaza al equivalente de otro súper si el
  //           producto ya estaba cargado (elegir el precio de Coto para algo que
  //           venía de Dia lo reemplaza en vez de duplicarlo).
  //   baja  — el toggle general, el mismo que usa el carrito para sacar un item.
  //
  // El `await onCarritoChange()` antes de soltar el botón no es cosmético: la
  // celda decide alta o baja mirando `carritoIds`, así que si se reabilitara
  // antes de que ese estado se refresque, un segundo clic rápido leería el valor
  // viejo y volvería a agregar lo que se acababa de sacar.
  async function toggleCelda(fila, celda, enCarrito) {
    setOcupado(`c${fila.id}`);
    try {
      if (enCarrito) {
        await fetch(`${API}/carrito/${celda.producto_id}`, {
          method: "POST", headers: { Authorization: `Bearer ${token}` },
        });
      } else {
        await fetch(`${API}/carrito/desde-lista/${celda.producto_id}`, {
          method: "POST", headers: authJson, body: JSON.stringify({ cantidad: fila.cantidad }),
        });
      }
    } catch (e) {}
    await onCarritoChange();
    setOcupado(null);
  }

  async function volcar(supermercado) {
    setOcupado(supermercado || "mixta");
    try {
      const res = await fetch(`${API}/listas/${listaActivaId}/al-carrito`, {
        method: "POST", headers: authJson,
        body: JSON.stringify({
          supermercado: supermercado || null,
          region_id: regionId || null,
          // El mismo universo de columnas que se usó para la comparación, para
          // que la compra mixta cargue exactamente el total que se está viendo.
          supermercados: supersVisibles,
        }),
      });
      const d = await res.json();
      if (!res.ok) setAviso(d.detail || "No se pudo cargar el carrito");
      else setAviso(
        `Cargamos ${d.agregados} producto${d.agregados !== 1 ? "s" : ""} al carrito` +
        (d.sin_disponibilidad ? ` (${d.sin_disponibilidad} sin disponibilidad ahí)` : "")
      );
    } catch (e) { setAviso("No se pudo cargar el carrito"); }
    setOcupado(null); onCarritoChange();
    setTimeout(() => setAviso(null), 5000);
  }

  async function nuevaLista() {
    const nombre = window.prompt("Nombre de la lista", "Mi lista");
    if (!nombre || !nombre.trim()) return;
    try {
      const res = await fetch(`${API}/listas`, {
        method: "POST", headers: authJson, body: JSON.stringify({ nombre: nombre.trim().slice(0, 60) }),
      });
      const d = await res.json();
      if (res.ok) { onListasChange(); setListaActivaId(d.id); }
      else setAviso(d.detail || "No se pudo crear la lista");
    } catch (e) {}
  }

  async function borrarLista() {
    if (!window.confirm("¿Borrar esta lista? No se puede deshacer.")) return;
    try {
      await fetch(`${API}/listas/${listaActivaId}`, {
        method: "DELETE", headers: { Authorization: `Bearer ${token}` },
      });
    } catch (e) {}
    setListaActivaId(null); onListasChange();
  }

  const toolbar = (
    <div className="lista-toolbar">
      {listas.length > 0 && (
        <select className="lista-select" value={listaActivaId || ""}
          onChange={e => setListaActivaId(e.target.value ? Number(e.target.value) : null)}>
          {listas.map(l => (
            <option key={l.id} value={l.id}>{l.nombre} ({l.total_items})</option>
          ))}
        </select>
      )}
      <button className="lista-btn" onClick={nuevaLista}>+ Nueva lista</button>
      {listaActivaId && <button className="lista-btn danger" onClick={borrarLista}>Borrar</button>}
      <button className="lista-btn" onClick={() => setShowPagos(true)}
        style={misPagos.length ? {borderColor:"rgba(124,58,237,0.35)", color:"#7C3AED"} : null}
        title="Elegí tus tarjetas para ver los descuentos bancarios aplicados">
        💳<span className="btn-label"> Medios de pago</span>
        {misPagos.length > 0 && <> ({misPagos.length})</>}
      </button>
      {aviso && <span style={{fontSize:12,fontWeight:700,color:"var(--info)"}}>{aviso}</span>}
      {/* Va acá dentro y no en el return final porque el botón que lo abre está
          en este toolbar, que también se renderiza en los estados de vacío,
          carga y error — ahí el modal tiene que poder abrirse igual. */}
      {showPagos && (
        <MediosPagoModal token={token} onClose={() => setShowPagos(false)}
          onGuardado={ents => { setMisPagos(ents); cargar(); }}/>
      )}
    </div>
  );

  if (listas.length === 0 && !cargando) {
    return (
      <div>
        {toolbar}
        <div className="cart-empty">
          <div style={{fontSize:56}}>📋</div>
          <p style={{fontSize:17,marginTop:14,fontWeight:800,color:"var(--text-primary)"}}>Todavía no tenés listas</p>
          <p style={{fontSize:13.5,marginTop:6,color:"var(--text-secondary)",maxWidth:340,lineHeight:1.6}}>
            Creá una lista, agregale productos con el botón 📋 y te decimos cuánto te sale la compra completa en cada supermercado.
          </p>
        </div>
      </div>
    );
  }

  if (cargando) return <div>{toolbar}<div className="cart-empty"><p>Calculando precios…</p></div></div>;
  if (error)    return <div>{toolbar}<div className="cart-empty"><p>{error}</p></div></div>;
  if (!data)    return <div>{toolbar}</div>;

  const items  = data.items  || [];
  const supers = data.supers || [];

  if (items.length === 0) {
    return (
      <div>
        {toolbar}
        <div className="cart-empty">
          <div style={{fontSize:56}}>📋</div>
          <p style={{fontSize:17,marginTop:14,fontWeight:800,color:"var(--text-primary)"}}>Esta lista está vacía</p>
          <p style={{fontSize:13.5,marginTop:6,color:"var(--text-secondary)",maxWidth:340,lineHeight:1.6}}>
            Agregá productos con el botón 📋 de cada tarjeta en la pestaña de productos.
          </p>
        </div>
      </div>
    );
  }

  // Resumen: como las columnas se ordenan por cobertura, el más barato puede
  // quedar fuera de pantalla. Acá se nombra siempre, scrollee o no el usuario.
  const completos   = supers.filter(s => s.faltantes === 0);
  const mejorComp   = completos[0] || null;                       // ya vienen ordenados por precio
  const masBarato   = supers.reduce((a, b) => (!a || b.total_estimado < a.total_estimado ? b : a), null);
  const mixta       = data.compra_mixta;
  const ahorroMixta = mejorComp && mixta ? mejorComp.total_estimado - mixta.total : 0;
  // Columnas que están sólo como referencia: la cadena no vende en la región.
  const referencias = supers.map(s => s.supermercado).filter(n => !superLlegaA(n, regionCodigo));
  const hayReferencia = referencias.length > 0;

  // Con medios de pago cargados hay DOS respuestas a "cuál conviene": la de
  // góndola (la de arriba, que vale para cualquiera) y la de este usuario con
  // sus tarjetas. Se muestran las dos y sólo cuando difieren, para no repetir.
  const costoFinal  = s => (s.promo_bancaria ? s.promo_bancaria.costo_final : s.total_estimado);
  const mejorPago   = completos.reduce((a, b) => (!a || costoFinal(b) < costoFinal(a) ? b : a), null);
  const ahorroPago  = mejorComp && mejorPago ? mejorComp.total_estimado - costoFinal(mejorPago) : 0;
  const hayTope     = supers.some(s => (s.promo_bancaria?.promos || []).some(p => p.motivo?.includes("tope")));

  return (
    <div>
      {toolbar}

      <div className="lista-resumen">
        {mejorComp ? (
          <div className="lista-resumen-linea">
            ✅ Compra completa más barata: <strong>{mejorComp.supermercado} {fmt(mejorComp.total_estimado)}</strong>
          </div>
        ) : (
          <div className="lista-resumen-linea">
            ⚠️ Ningún supermercado tiene la lista completa — los totales incluyen una estimación de lo que falta.
          </div>
        )}
        {masBarato && mejorComp && masBarato.supermercado !== mejorComp.supermercado && (
          <div className="lista-resumen-linea">
            🔻 El total más bajo es <strong>{masBarato.supermercado} {fmt(masBarato.total_estimado)}</strong>, pero
            le falta{masBarato.faltantes > 1 ? "n" : ""} {masBarato.faltantes} producto{masBarato.faltantes > 1 ? "s" : ""}.
          </div>
        )}
        {mejorPago && ahorroPago > 0 && (
          <div className="lista-resumen-linea pago">
            💳 Pagando con {(mejorPago.promo_bancaria.promos || []).map(p => `${p.entidad} ${p.pct}%`).join(" + ")}
            {/* Mismo motivo que en el badge: esta línea es la que decide a qué
                súper va el usuario, así que no puede prometer un tramo que
                depende de una cartera que quizá no tenga. Va acá, pegado a la
                entidad, y no al final: al final se lee como una condición del
                ahorro contra el otro súper, que es otra cosa. */}
            {(() => {
              const req = [...new Set((mejorPago.promo_bancaria.promos || [])
                .map(p => p.membresia).filter(Boolean))];
              return req.length ? <> (sólo con {req.join(" y ")})</> : null;
            })()}
            {" "}te sale <strong>{fmt(costoFinal(mejorPago))}</strong> en {mejorPago.supermercado}
            {mejorComp && mejorPago.supermercado !== mejorComp.supermercado
              ? <> — {fmt(ahorroPago)} menos que {mejorComp.supermercado}, que es el más barato de góndola</>
              : <> — ahorrás {fmt(ahorroPago)}</>}
          </div>
        )}
        {misPagos.length === 0 && (
          <div className="lista-resumen-linea">
            💳 <button className="lista-btn" style={{padding:"2px 8px",fontSize:12}}
              onClick={() => setShowPagos(true)}>Cargá tus medios de pago</button>
            {" "}y te decimos cuánto te sale con tus descuentos bancarios.
          </div>
        )}
        {mixta && (
          <div className="lista-resumen-linea mixta">
            💚 Comprando cada cosa donde está más barata: <strong>{fmt(mixta.total)}</strong>
            {ahorroMixta > 0 && <> — ahorrás {fmt(ahorroMixta)} contra el mejor súper único</>}
          </div>
        )}
        {hayReferencia && (
          <div className="lista-resumen-linea">
            👀 {referencias.join(", ")} {referencias.length > 1 ? "no venden" : "no vende"} en tu
            región: {referencias.length > 1 ? "esas columnas van" : "esa columna va"} como referencia
            de precio y no {referencias.length > 1 ? "entran" : "entra"} en la compra.
          </div>
        )}
        {data.sin_precio > 0 && (
          <div className="lista-resumen-linea">
            ℹ️ {data.sin_precio} producto{data.sin_precio > 1 ? "s" : ""} sin precio en ningún súper visible — no entra{data.sin_precio > 1 ? "n" : ""} en los totales.
          </div>
        )}
        {hayTope && (
          <div className="lista-resumen-nota">
            Los topes de reintegro son por mes o por semana y por cuenta: calculamos suponiendo
            que todavía no lo usaste. Si ya lo consumiste, el ahorro real va a ser menor.
          </div>
        )}
      </div>

      <div className="lista-grid-wrap">
        <table className="lista-grid">
          <thead>
            <tr>
              <th className="lg-corner">
                <span style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:0.5,color:"var(--text-muted)"}}>
                  {items.length} producto{items.length !== 1 ? "s" : ""}
                </span>
              </th>
              {supers.map(s => (
                <th className="lg-super" key={s.supermercado}>
                  <div className="lg-super-inner">
                    <SuperBadge nombre={s.supermercado} bare={true} {..._cajaLogoGrilla(s.supermercado)}/>
                  </div>
                </th>
              ))}
            </tr>
          </thead>

          <tbody>
            {items.map(fila => (
              <tr key={fila.id}>
                <th className="lg-prod">
                  <div className="lg-prod-row">
                    <button className="lg-prod-abrir img" onClick={() => abrirFicha(fila)}
                      disabled={!fichaDe(fila)} tabIndex={-1} aria-hidden="true">
                      {fila.imagen_url
                        ? <img src={fila.imagen_url} alt={fila.nombre} className="lg-prod-img"/>
                        : <div className="lg-prod-img" style={{display:"flex",alignItems:"center",justifyContent:"center"}}>🛍️</div>}
                    </button>
                    <div style={{minWidth:0,flex:1}}>
                      <button className="lg-prod-abrir" onClick={() => abrirFicha(fila)}
                        disabled={!fichaDe(fila)}
                        title={fichaDe(fila)
                          ? `${fila.nombre} — ver detalle e historial`
                          : `${fila.nombre} — sin precios para mostrar`}>
                        <div className="lg-prod-nombre">{fila.nombre}</div>
                      </button>
                      <div className="lg-prod-bottom">
                        <div className="qty-control">
                          <button className="qty-btn" disabled={fila.cantidad <= 1}
                            onClick={() => cambiarCantidad(fila, fila.cantidad - 1)}>−</button>
                          <span className="qty-val">{fila.cantidad}</span>
                          <button className="qty-btn" disabled={fila.cantidad >= 99}
                            onClick={() => cambiarCantidad(fila, fila.cantidad + 1)}>+</button>
                        </div>
                        <button className="cart-item-remove" title="Quitar de la lista"
                          onClick={() => quitar(fila)}>✕</button>
                      </div>
                      {!fila.comparable && (
                        <div className="lg-prod-nocomp">sin código de barras — no comparable</div>
                      )}
                    </div>
                  </div>
                </th>

                {supers.map(s => {
                  const celda     = fila.precios[s.supermercado];
                  const esMejor   = celda && fila.mas_barato === s.supermercado;
                  const enCarrito = celda && carritoIds.has(celda.producto_id);
                  // La celda de una cadena que no llega muestra el precio pero
                  // no se puede tocar: agregarla armaría un carrito que después
                  // no hay dónde cerrar.
                  const llega     = superLlegaA(s.supermercado, regionCodigo);
                  return (
                    <td key={s.supermercado}
                        className={`lg-cell ${esMejor ? "mejor" : ""} ${enCarrito ? "en-carrito" : ""}`}>
                      <button className="lg-cell-btn" disabled={!celda || !llega || ocupado === `c${fila.id}`}
                        onClick={() => toggleCelda(fila, celda, enCarrito)}
                        title={!celda
                          ? `${s.supermercado} no tiene este producto`
                          : !llega
                            ? `${s.supermercado} no vende en tu región: el precio va como referencia`
                            : enCarrito
                              ? `Quitar del carrito`
                              : `Agregar al carrito desde ${s.supermercado}`}>
                        {celda ? (
                          <>
                            <span>{fmt(celda.precio * fila.cantidad)}</span>
                            {!llega
                              ? <span className="lg-cell-tag">👀 referencia</span>
                              : enCarrito
                                ? <span className="lg-cell-swap">
                                    <span className="lg-cell-tag lg-swap-puesto">✓ en carrito</span>
                                    <span className="lg-cell-tag lg-swap-quitar">− quitar</span>
                                  </span>
                                : celda.precio_regional
                                  ? <span className="lg-cell-tag">📍 tu región</span>
                                  : <span className="lg-cell-add">+ carrito</span>}
                          </>
                        ) : "—"}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>

          <tfoot>
            <tr>
              <th className="lg-corner-bottom">
                <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:0.5,color:"var(--text-muted)"}}>
                  Total de la lista
                </div>
                {mixta && (
                  // La compra mixta reparte la lista entre las columnas que se
                  // están viendo. Si alguna es una cadena que no vende en la
                  // región (tildada a propósito, como referencia), el total de
                  // arriba incluye precios que no se pueden comprar y el
                  // volcado cargaría otra cosa: se desactiva hasta destildarla.
                  <button className="lg-total-btn" disabled={ocupado === "mixta" || hayReferencia}
                    style={{background: hayReferencia ? "var(--text-muted)" : "#059669"}}
                    title={hayReferencia
                      ? `Destildá ${referencias.join(", ")} para poder repartir la compra: no vende${referencias.length > 1 ? "n" : ""} en tu región.`
                      : undefined}
                    onClick={() => volcar(null)}>
                    {ocupado === "mixta" ? "…" : <>💚<span className="btn-label"> Compra mixta</span> {fmt(mixta.total)}</>}
                  </button>
                )}
              </th>
              {supers.map(s => (
                <td className="lg-total" key={s.supermercado}>
                  <div className="lg-total-monto">{fmt(s.total_estimado)}</div>
                  <div className={`lg-total-nota ${s.faltantes === 0 ? "completa" : ""}`}
                    title={s.faltantes
                      ? `Incluye ${fmt(s.estimado_faltantes)} estimados en ${s.faltantes} producto${s.faltantes > 1 ? "s" : ""} que ${s.supermercado} no tiene. Lo que sí tiene suma ${fmt(s.total_real)}.`
                      : "Tiene todos los productos de la lista"}>
                    {s.faltantes === 0
                      ? "lista completa"
                      : `estimado — falta${s.faltantes > 1 ? "n" : ""} ${s.faltantes}`}
                  </div>
                  <PromoBadge promo={s.promo_bancaria}/>
                  {/* La columna de una cadena que no vende en la región queda
                      como referencia de precio, sin volcado: su carrito no se
                      puede cerrar desde acá (ver SUPER_POR_REGION). */}
                  {superLlegaA(s.supermercado, regionCodigo) ? (
                    <button className="lg-total-btn" disabled={ocupado === s.supermercado || s.cubiertos === 0}
                      onClick={() => volcar(s.supermercado)}>
                      {ocupado === s.supermercado ? "…" : <>Cargar {s.cubiertos}<span className="btn-label"> al carrito</span></>}
                    </button>
                  ) : (
                    <div className="lg-total-nota" title={`${s.supermercado} no vende en tu región`}>
                      no llega — referencia
                    </div>
                  )}
                </td>
              ))}
            </tr>
          </tfoot>
        </table>
      </div>

      {/* Misma ficha que en la pestaña de productos. Sin onCambiarSuper: acá el
          cambio de súper se hace tocando la celda de la grilla, y ofrecerlo
          también desde el modal haría dos caminos para lo mismo. */}
      {ficha && <Modal producto={ficha} onClose={() => setFicha(null)} supersFiltro={supersVisibles}/>}
    </div>
  );
}

// ProductCard
// ---------------------------------------------------------------------------
const ProductCard = React.memo(function ProductCard({ p, enCarrito, enLista, onFav, onCarrito, onLista, onOpen, supersVisibles, regionCodigo }) {
  const hasOffer = p.descuento_pct || p.promocion;
  const esVtex = SUPER_VTEX.includes(p.supermercado);
  // Cadena que no vende en la región elegida: se ve el precio (el usuario la
  // tildó a propósito, sirve de referencia) pero no se ofrece agregar al
  // carrito, porque ese carrito no se puede cerrar desde acá.
  const llegaAcá = superLlegaA(p.supermercado, regionCodigo);
  // Ocultar de la comparación los supers que el usuario destildó en el filtro
  const otros = (p.otros_supers || []).filter(o => !supersVisibles || supersVisibles.includes(o.supermercado));
  const hayComparacion = otros.length > 0;
  // Sólo los OTROS supers (el principal ya es el encabezado de la card), más barato primero
  const otrosOrdenados = [...otros].sort((a, b) => a.precio - b.precio);
  // Todos los precios (el de esta card + los otros supers) ordenados de más barato a más caro
  const listaPrecios = [
    { supermercado: p.supermercado, precio: p.precio, esActual: true },
    ...otros.map(o => ({ supermercado: o.supermercado, precio: o.precio, esActual: false })),
  ].sort((a, b) => a.precio - b.precio);
  const actualEsMejor = hayComparacion && listaPrecios[0].esActual;
  const precioMax = hayComparacion ? Math.max(...otros.map(o => o.precio)) : 0;
  const ahorro = actualEsMejor ? precioMax - p.precio : 0;
  // Si el súper de esta card NO es el más barato, cuánto y en qué súper conviene comprarlo
  const masBarato = hayComparacion && !actualEsMejor ? listaPrecios[0] : null;
  const diffMasBarato = masBarato ? p.precio - masBarato.precio : 0;
  const AHORRO_MINIMO = 100; // solo mostramos el cartel si el monto supera este valor

  return (
    <div className={`product-card ${hasOffer?"offer":""}`} onClick={()=>onOpen(p)}>
      <div className="card-image-wrap">
        <div className="card-badges-top">
          <div className="card-badge-super">
            <SuperLogo nombre={p.supermercado} size={24} bare={true}/>
            <span>{p.supermercado}</span>
          </div>
          {p.scrapeado_en && <span className="card-badge-time">{relTime(p.scrapeado_en)}</span>}
        </div>
        {p.imagen_url && <img src={p.imagen_url} alt={p.nombre} loading="lazy" className="card-image"/>}
      </div>

      <div className="card-body">
        <div className="card-category">{SUBCAT_LABELS[p.subcategoria]||CAT_LABELS[p.categoria]||p.categoria}</div>
        <div className="card-name">{p.nombre}</div>

        <div className="card-price-block">
          <span className={`card-price ${hasOffer?"offer":""}`}>{fmt(p.precio)}</span>
          {p.precio_regional && <span className="card-region">📍 tu región</span>}
          {(hasOffer || p.precio_original) && (
            <div className="card-price-side">
              {hasOffer && <span className="card-discount-inline">{p.descuento_pct ? `-${p.descuento_pct}%` : "OFERTA"}</span>}
              {p.precio_original && <span className="card-price-old">{fmt(p.precio_original)}</span>}
            </div>
          )}
        </div>

        {p.promocion && !esPromoDescuento(p.promocion) && <span className="card-promo" style={{background:promoColor(p.promocion)}}>{p.promocion}</span>}

        {hayComparacion && (
          <div className="card-compare">
            {otrosOrdenados.slice(0, 3).map(o => {
              const esMejor = masBarato && o.supermercado === masBarato.supermercado && diffMasBarato > 0;
              return (
                <a key={o.supermercado} className={`card-compare-row ${esMejor ? "cheaper" : ""}`}
                  href={o.url || undefined} target="_blank" rel="noopener noreferrer"
                  onClick={e=>e.stopPropagation()}>
                  <span className="card-compare-name">
                    <SuperLogo nombre={o.supermercado} size={14} bare={true}/>
                    {o.supermercado}
                  </span>
                  <span className={`card-compare-price ${esMejor ? "cheaper" : "worse"}`}>
                    {fmt(o.precio)}
                  </span>
                </a>
              );
            })}
            {otrosOrdenados.length > 3 && (
              <div className="card-compare-more">
                +{otrosOrdenados.length - 3} supermercado{otrosOrdenados.length - 3 > 1 ? "s" : ""} más
              </div>
            )}
            {ahorro > AHORRO_MINIMO && (
              <div className="card-compare-savings">
                💚 Ahorrá {fmt(ahorro)} comprando acá
              </div>
            )}
            {diffMasBarato > AHORRO_MINIMO && (
              <div className="card-compare-savings cheaper">
                🔻 {fmt(diffMasBarato)} más barato en {masBarato.supermercado}
              </div>
            )}
          </div>
        )}

        <div className="card-actions">
          <button className={`card-btn fav ${p.favorito?"active":""}`} onClick={e=>onFav(e,p.id)} title={p.favorito?"Quitar de favoritos":"Agregar a favoritos"}>
            {p.favorito?"❤️":"🤍"}
          </button>
          {/* La lista es planificación, no compra: va para TODOS los supers, también
              los que no tienen flujo de carga de carrito (Dino, La Gallega, etc.).
              Por eso queda FUERA del condicional VTEX/Coto de acá abajo. */}
          <button className={`card-btn ${enLista?"accent":""}`} onClick={e=>onLista(e,p)}
            title={enLista?"Quitar de mi lista":"Agregar a mi lista"}>
            📋<span className="btn-label">{enLista?"En lista":"Lista"}</span>
          </button>
          {/* Átomo no es VTEX, pero su carrito se carga de un clic y encima sin pedir
              cuenta (ver cargarCarritoEnAtomo), así que va del lado de los que tienen
              botón de carrito y no del de Dino/La Gallega. */}
          {!llegaAcá ? (
            <a className="card-btn buy" href={p.url||undefined} target="_blank" rel="noopener noreferrer"
              onClick={e=>e.stopPropagation()} style={{textDecoration:"none"}}
              title={`${p.supermercado} no vende en tu región: el precio va como referencia`}>
              👀<span className="btn-label">Referencia</span>
            </a>
          ) : p._sinIdPropio ? (
            <a className="card-btn primary buy" href={p.url||undefined} target="_blank" rel="noopener noreferrer"
              onClick={e=>e.stopPropagation()} title={`Ver en ${p.supermercado}`} style={{textDecoration:"none"}}>
              Ver en {p.supermercado} →
            </a>
          ) : (esVtex || p.supermercado === "Coto" || p.supermercado === "Atomo") ? (
            <button className={`card-btn buy ${enCarrito?"accent":"primary"}`} onClick={e=>onCarrito(e,p)} title={enCarrito?"Quitar del carrito":"Agregar al carrito"}>
              🛒<span className="btn-label">{enCarrito?"En carrito":"Agregar"}</span>
            </button>
          ) : null}
        </div>
      </div>
    </div>
  );
});

// Sidebar Filters
// ---------------------------------------------------------------------------
function Sidebar({ supersVisibles, setSupersVisibles, catFiltro, setCatFiltro, subcatFiltro, setSubcatFiltro, soloOfertas, setSoloOfertas, stats, regionCodigo }) {
  // Las que llegan primero: si no, el usuario de Tucumán abre el panel y lo que
  // ve arriba son seis cadenas que no le sirven.
  const supers = React.useMemo(() => {
    if (!regionCodigo) return SUPER_TODOS;
    return [...SUPER_TODOS].sort((a, b) =>
      (superLlegaA(b, regionCodigo) ? 1 : 0) - (superLlegaA(a, regionCodigo) ? 1 : 0));
  }, [regionCodigo]);
  const sinCobertura = SUPER_TODOS.filter(s => !superLlegaA(s, regionCodigo));
  const cats = ["Todas", ...Object.keys(CATEGORIAS)];
  const subcats = catFiltro !== "Todas" && CATEGORIAS[catFiltro] ? ["Todas", ...Object.keys(CATEGORIAS[catFiltro].subs)] : [];

  const todosMarcados = supersVisibles.length === supers.length;
  const algunoMarcado = supersVisibles.length > 0;
  const toggleSuper = (s) => setSupersVisibles(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);
  const toggleTodos = () => setSupersVisibles(todosMarcados ? [] : supers);

  return (
    <div>
      <div className="filter-card">
        <div className="filter-title">Supermercado</div>
        <div className="filter-hint">Definen lo que ves y de qué supermercados recibís alertas de precio.</div>
        <div className="filter-checks">
          <label className="filter-check master">
            <input type="checkbox" checked={todosMarcados}
              ref={el => { if (el) el.indeterminate = algunoMarcado && !todosMarcados; }}
              onChange={toggleTodos}/>
            <span className="filter-check-name">Todos</span>
          </label>
          {supers.map(s => {
            const llega = superLlegaA(s, regionCodigo);
            return (
              <label key={s} className={`filter-check ${supersVisibles.includes(s)?"on":""} ${llega?"":"sin-cobertura"}`}
                title={llega ? undefined : "No vende en tu región. Podés tildarlo igual para usarlo de referencia, pero no vas a poder comprar."}>
                <input type="checkbox" checked={supersVisibles.includes(s)} onChange={()=>toggleSuper(s)}/>
                <SuperLogo nombre={s} size={18} bare={true}/>
                <span className="filter-check-name">{s}</span>
                {!llega && <span className="filter-check-tag">no llega</span>}
                {stats.por_super && <span className="count">{stats.por_super[s] || 0}</span>}
              </label>
            );
          })}
        </div>
        {sinCobertura.length > 0 && (
          <div className="filter-hint" style={{marginTop:8}}>
            {sinCobertura.length === 1 ? "1 cadena no vende" : `${sinCobertura.length} cadenas no venden`} en tu
            región y quedaron destildadas. Podés tildarlas para ver el precio de referencia.
          </div>
        )}
      </div>

      <div className="filter-card">
        <div className="filter-title">Categoría</div>
        <div className="filter-group">
          {cats.map(c => (
            <button key={c} className={`filter-chip ${catFiltro===c?"active":""}`} onClick={()=>{setCatFiltro(c);setSubcatFiltro("Todas");}}>
              <span>{CAT_LABELS[c]||"Todas"}</span>
            </button>
          ))}
        </div>
      </div>

      {subcats.length > 0 && (
        <div className="filter-card">
          <div className="filter-title">Subcategoría</div>
          <select value={subcatFiltro} onChange={e=>setSubcatFiltro(e.target.value)}
            style={{width:"100%",padding:"8px 10px",borderRadius:"var(--radius)",fontSize:12.5,fontWeight:600,border:"1.5px solid var(--border)",background:"var(--surface)",color:"var(--text-secondary)",cursor:"pointer",outline:"none",fontFamily:"inherit"}}>
            {subcats.map(s => (<option key={s} value={s}>{s==="Todas"?"Todas las subcategorías":SUBCAT_LABELS[s]||s}</option>))}
          </select>
        </div>
      )}

      <div className="filter-card">
        <div className="filter-title">Filtros rápidos</div>
        <div className="filter-toggle" onClick={()=>setSoloOfertas(!soloOfertas)}>
          <div className={`toggle-track ${soloOfertas?"on":""}`}>
            <div className="toggle-thumb"/>
          </div>
          <span className={`toggle-label ${soloOfertas?"on":""}`}>Solo ofertas y promos</span>
        </div>
      </div>
    </div>
  );
}

// Cuántos logos entran en la tira antes de resumir en "+N". Diez es lo que
// llena dos renglones del modal sin empujar el botón fuera de pantalla.
const _WELCOME_BANCOS_VISIBLES = 10;

function WelcomeModal({ onClose }) {
  // El catálogo sale de la API y no de una lista fija por la misma razón que el
  // selector: se arma con las promos ACTIVAS, así que una entidad cuya promo
  // venció deja de mostrarse sola. Es público, no pide token. Si falla, el
  // bloque se queda con el texto —que es lo que importa— y sin la tira.
  const [entidades, setEntidades] = React.useState([]);
  React.useEffect(() => {
    fetch(`${API}/medios-pago`)
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(d => setEntidades((d.entidades || []).map(e => e.entidad)))
      .catch(() => {});
  }, []);
  // Solo van a la tira las que tienen ícono; el resto sumaría cuadraditos de
  // monograma que acá no aportan nada. Y se descartan los REPETIDOS: las dos de
  // CencoPay comparten isotipo, igual que las tres tarjetas de Carrefour, y sin
  // el nombre al lado dos chips idénticos pegados se leen como un error.
  // El "+N" sí cuenta el catálogo entero, que es la cobertura real.
  const tira = React.useMemo(() => {
    const vistos = new Set();
    return entidades.filter(e => {
      const src = PAGO_LOGOS[e];
      if (!src || vistos.has(src)) return false;
      vistos.add(src);
      return true;
    }).slice(0, _WELCOME_BANCOS_VISIBLES);
  }, [entidades]);
  const mas = entidades.length - tira.length;

  const pasos = [
    { ico: "📍", t: "Elegí tu región", d: "Arriba a la izquierda. Así ves los precios y promos de tu zona." },
    { ico: "✅", t: "Marcá tus supermercados", d: "Elegí de cuáles querés ver precios y recibir alertas." },
    { ico: "❤️", t: "Guardá favoritos", d: "Te avisamos por email cuando un producto baja de precio." },
    { ico: "📋", t: "Armá tu lista", d: "Cargá lo que comprás siempre y te mostramos cuánto sale la lista completa en cada supermercado." },
    { ico: "🛒", t: "Comprá donde conviene", d: "Pasás la lista al carrito del súper más barato y terminás la compra en su sitio." },
  ];
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="welcome-modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close welcome-close" onClick={onClose} aria-label="Cerrar">✕</button>
        <div className="welcome-hero">
          <div className="welcome-icon">🛒</div>
          <div className="welcome-title">¡Bienvenido a <span>SuperPrecios</span> AR!</div>
          <div className="welcome-sub">Comparamos los precios de {SUPER_TODOS.length} supermercados de Argentina para que compres siempre al más barato.</div>
        </div>
        <div className="welcome-steps">
          {pasos.map((p, i) => (
            <div className="welcome-step" key={i}>
              <span className="welcome-step-ico">{p.ico}</span>
              <div>
                <div className="welcome-step-t">{p.t}</div>
                <div className="welcome-step-d">{p.d}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="welcome-savings">
          <span className="welcome-savings-emoji">💚</span>
          <div>
            <strong>¿Cuánto podés ahorrar?</strong> El mismo producto puede costar hasta un 30–40% más caro en un súper que en otro. Comparando, tu compra del mes puede ahorrarte miles de pesos!
          </div>
        </div>
        <div className="welcome-bancos">
          <span className="welcome-bancos-emoji">💳</span>
          <div>
            <strong>¡PROMOS BANCARIAS!</strong> Tildá tus tarjetas y te decimos cuánto te
            sale la lista <strong>a vos!</strong> Los descuentos aplican sobre el total de la compra
             o con reintegro a tu cuenta.
            {tira.length > 0 && (
              <div className="welcome-bancos-logos">
                {tira.map(e => <PagoLogo key={e} nombre={e} size={26}/>)}
                {mas > 0 && <span className="welcome-bancos-mas">+{mas}</span>}
              </div>
            )}
          </div>
        </div>
        <div className="welcome-pie">
          <button className="welcome-cta" onClick={onClose}>Empezar a ahorrar →</button>
        </div>
      </div>
    </div>
  );
}
