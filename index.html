function App() {
  const [productos, setProductos] = React.useState([]);
  const [stats, setStats] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [tab, setTab] = React.useState("todos");
  const [supersVisibles, setSupersVisibles] = React.useState(() => {
    // Deslogueado: recordamos la selección en localStorage. Logueado: la sobrescribe /preferencia.
    try { const s = JSON.parse(localStorage.getItem("sp_supers")); return Array.isArray(s) && s.length ? s.filter(x => SUPER_TODOS.includes(x)) : SUPER_TODOS; }
    catch { return SUPER_TODOS; }
  });
  const [catFiltro, setCatFiltro] = React.useState("Todas");
  const [subcatFiltro, setSubcatFiltro] = React.useState("Todas");
  const [soloOfertas, setSoloOfertas] = React.useState(false);
  const [orden, setOrden] = React.useState("popular");
  const [busqueda, setBusqueda] = React.useState("");
  const [modalProducto, setModalProducto] = React.useState(null);
  const [porPagina, setPorPagina] = React.useState(30);
  const [pagina, setPagina] = React.useState(1);
  const [totalProductos, setTotalProductos] = React.useState(0);
  // Término que la API tuvo que relajar (le sobraba una palabra), o null.
  const [busquedaRelajada, setBusquedaRelajada] = React.useState(null);
  const [totalPaginas, setTotalPaginas] = React.useState(1);
  const [usuario, setUsuario] = React.useState(() => { try { return JSON.parse(localStorage.getItem("sp_user")); } catch { return null; } });
  const [token, setToken] = React.useState(() => localStorage.getItem("sp_token") || null);
  const [showAuth, setShowAuth] = React.useState(false);
  const [showWelcome, setShowWelcome] = React.useState(() => {
    try { return !localStorage.getItem("sp_welcome_v1"); } catch { return false; }
  });
  const [legalTab, setLegalTab] = React.useState(null); // null = cerrado; "terminos"|"privacidad"|"descargos"
  const [carritoItems, setCarritoItems] = React.useState([]);
  const [listas, setListas] = React.useState([]);
  const [listaActivaId, setListaActivaId] = React.useState(() => {
    const saved = localStorage.getItem("sp_lista"); return saved ? Number(saved) : null;
  });
  const [listaItems, setListaItems] = React.useState([]);
  const [productosMap, setProductosMap] = React.useState({});
  const [regiones, setRegiones] = React.useState([]);
  const [regionId, setRegionId] = React.useState(() => { const saved = localStorage.getItem("sp_region"); return saved ? Number(saved) : null; });
  const [sidebarOpen, setSidebarOpen] = React.useState(false);

  // El código de la región elegida ("cordoba", "tucuman"…). Es la clave de
  // SUPER_POR_REGION; el regionId sólo sirve para hablar con la API.
  const regionCodigo = React.useMemo(
    () => (regiones.find(r => r.id === regionId) || {}).codigo || null,
    [regiones, regionId]
  );

  // Al entrar a una región se destildan las cadenas que no venden ahí. Se aplica
  // UNA vez por región, no en cada render: sin el ref, volver a tildar Coto en
  // Tucumán lo destildaría en el acto y el checkbox quedaría muerto (la idea es
  // justamente que se pueda mirar el precio como referencia).
  // Si el destildado dejaría la grilla vacía —el usuario tenía marcadas sólo
  // cadenas que no llegan— se tildan todas las que sí llegan, que es más útil
  // que una pantalla en blanco.
  const regionAplicadaRef = React.useRef(null);
  React.useEffect(() => {
    if (!regionCodigo || regionAplicadaRef.current === regionCodigo) return;
    regionAplicadaRef.current = regionCodigo;
    setSupersVisibles(prev => {
      const quedan = prev.filter(s => superLlegaA(s, regionCodigo));
      if (quedan.length === prev.length) return prev;
      return quedan.length ? quedan : SUPER_TODOS.filter(s => superLlegaA(s, regionCodigo));
    });
    // `supersVisibles` va en las dependencias para que el destildado alcance
    // también a la lista que llega de /preferencia después del login (que puede
    // resetear el ref sin que cambie la región). No hay bucle: el propio ref
    // corta en la segunda pasada, y tampoco pelea con el usuario que vuelve a
    // tildar una cadena, porque para entonces el ref ya coincide con la región.
  }, [regionCodigo, supersVisibles]);

  // Multi-selección de supermercados: si hay exactamente uno visible lo filtramos en el
  // servidor (paginación correcta); con un subconjunto filtramos en cliente sobre lo traído.
  const superParam = supersVisibles.length === 1 ? supersVisibles[0] : "";
  // Reproyectamos cada producto sobre los supers visibles: si el super principal quedó
  // destildado pero el producto existe en otro super visible, promovemos el más barato
  // visible como principal (así la card no desaparece). Se oculta solo si ningún super visible lo tiene.
  const productosVisibles = React.useMemo(() => {
    const visibles = new Set(supersVisibles);
    return productos.map(p => {
      // Si el super principal sigue visible, la card queda intacta (ProductCard filtra
      // los otros_supers destildados y mantiene el cartel "más barato en X" si corresponde).
      if (visibles.has(p.supermercado)) return p;
      // El principal quedó oculto: promovemos el mejor super visible entre los otros_supers.
      const visiblesOtros = (p.otros_supers || []).filter(o => visibles.has(o.supermercado));
      if (visiblesOtros.length === 0) return null; // ningún super visible tiene el producto
      visiblesOtros.sort((a,b) => a.precio - b.precio);
      const mejor = visiblesOtros[0];
      const restantes = visiblesOtros.slice(1).map(o => ({ supermercado:o.supermercado, precio:o.precio, url:o.url }));
      // El backend manda el id (y sku_id) de cada alternativa, así que el producto
      // promovido es una fila real y se puede agregar al carrito como cualquier otro.
      // Si no viniera (backend viejo), no sabemos qué fila es y hay que caer al link
      // "Ver en X" — agregar usaría el id del super destildado.
      const sinIdPropio = mejor.id == null;
      return {
        ...p,
        id: sinIdPropio ? p.id : mejor.id,
        supermercado: mejor.supermercado, precio: mejor.precio, url: mejor.url,
        sku_id: mejor.sku_id != null ? mejor.sku_id : null,
        // promo/descuento son propios del super original: no aplican al promovido
        precio_original: null, descuento_pct: null, promocion: null,
        otros_supers: restantes, _reproyectado: true, _sinIdPropio: sinIdPropio,
      };
    }).filter(Boolean);
  }, [productos, supersVisibles]);

  React.useEffect(() => {
    fetch(`${API}/regiones`).then(r => r.json())
      .then(data => { if (Array.isArray(data)) setRegiones(data); })
      .catch(() => {});
  }, []);

  // Autodetección de región por IP (solo si el usuario todavía no eligió una).
  // Usa ipwho.is (https, sin API key) y mapea el código de provincia AR a nuestras regiones.
  const geoIntentado = React.useRef(false);
  React.useEffect(() => {
    if (geoIntentado.current) return;
    if (regiones.length === 0) return;
    if (regionId || localStorage.getItem("sp_region")) return;
    geoIntentado.current = true;
    fetch("https://ipwho.is/?fields=success,country_code,region_code,city")
      .then(r => r.json())
      .then(g => {
        if (!g || !g.success || g.country_code !== "AR") return;
        const PROV_A_REGION = { C:"caba_gba", B:"caba_gba", X:"cordoba", S:"santa_fe_rosario", M:"mendoza", A:"salta", T:"tucuman" };
        let codigo = PROV_A_REGION[g.region_code];
        if (g.region_code === "B" && /la\s*plata/i.test(g.city || "")) codigo = "la_plata";
        if (!codigo) return;
        const match = regiones.find(r => r.codigo === codigo);
        if (match) cambiarRegion(match.id);
      })
      .catch(() => {});
  }, [regiones, regionId]);

  function cambiarRegion(id) {
    setRegionId(id);
    if (id) localStorage.setItem("sp_region", id);
    else localStorage.removeItem("sp_region");
    if (token) {
      fetch(`${API}/preferencia`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ region_id: id })
      }).catch(() => {});
    }
  }

  function handleLogin(access_token, refresh_token, user) {
    setToken(access_token); setUsuario(user);
    localStorage.setItem("sp_token", access_token);
    localStorage.setItem("sp_refresh", refresh_token||"");
    localStorage.setItem("sp_user", JSON.stringify(user));
  }
  function handleLogout() {
    setToken(null); setUsuario(null); setCarritoItems([]); setProductosMap({});
    setListas([]); setListaItems([]);
    localStorage.removeItem("sp_token"); localStorage.removeItem("sp_refresh"); localStorage.removeItem("sp_user");
  }

  React.useEffect(() => {
    if (!token) return;
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
      const expiresIn = payload.exp*1000 - Date.now() - 5*60*1000;
      if (expiresIn <= 0) { refreshToken(); return; }
      const timer = setTimeout(refreshToken, expiresIn);
      return () => clearTimeout(timer);
    } catch(e) {}
  }, [token]);

  async function refreshToken() {
    const refresh = localStorage.getItem("sp_refresh");
    if (!refresh) { handleLogout(); return; }
    try {
      const res = await fetch(`${API}/auth/refresh`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({refresh_token:refresh}) });
      if (!res.ok) { handleLogout(); return; }
      const data = await res.json();
      setToken(data.access_token);
      localStorage.setItem("sp_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("sp_refresh", data.refresh_token);
    } catch(e) { handleLogout(); }
  }

  // Devuelve la promesa (nunca rechaza) para que quien necesite esperar al
  // refresco pueda hacerlo: la grilla de listas decide agregar o quitar mirando
  // este estado, así que no puede reabilitar la celda antes de tenerlo al día.
  function cargarCarrito() {
    if (!token) return Promise.resolve();
    const qs = regionId ? `?region_id=${regionId}` : "";
    return fetch(`${API}/carrito${qs}`, { headers:{Authorization:`Bearer ${token}`} })
      .then(r => r.json())
      .then(data => {
        if (!Array.isArray(data)) return;
        setCarritoItems(data);
        setProductosMap(prev => {
          const next = {...prev};
          data.forEach(i => { if (i.producto) next[i.producto_id] = i.producto; });
          return next;
        });
      })
      .catch(() => {});
  }

  // --- Listas de compras ----------------------------------------------------
  function cargarListas() {
    if (!token) return;
    fetch(`${API}/listas`, { headers:{Authorization:`Bearer ${token}`} })
      .then(r => r.json())
      .then(data => {
        if (!Array.isArray(data)) return;
        setListas(data);
        // Si la lista guardada ya no existe (o nunca hubo), caemos a la primera.
        setListaActivaId(prev => (prev && data.some(l => l.id === prev)) ? prev : (data[0]?.id ?? null));
      })
      .catch(() => {});
  }

  // Items de la lista activa: solo se usan para pintar el estado "En lista" de
  // las tarjetas. La comparación con precios la pide ListaView por su cuenta.
  function cargarListaItems() {
    if (!token || !listaActivaId) { setListaItems([]); return; }
    fetch(`${API}/listas/${listaActivaId}/items`, { headers:{Authorization:`Bearer ${token}`} })
      .then(r => r.ok ? r.json() : [])
      .then(data => setListaItems(Array.isArray(data) ? data : []))
      .catch(() => {});
  }

  React.useEffect(() => {
    if (listaActivaId) localStorage.setItem("sp_lista", listaActivaId);
    else localStorage.removeItem("sp_lista");
    cargarListaItems();
  }, [listaActivaId, token]);

  // La identidad del item es el EAN cuando lo hay, el producto_id cuando no
  // (mismo criterio que database._buscar_item).
  const listaEans = React.useMemo(
    () => new Set(listaItems.filter(i => i.ean).map(i => i.ean)), [listaItems]);
  const listaPids = React.useMemo(
    () => new Set(listaItems.filter(i => !i.ean).map(i => i.producto_id)), [listaItems]);
  const carritoIds = React.useMemo(
    () => new Set(carritoItems.map(i => i.producto_id)), [carritoItems]);

  const toggleLista = React.useCallback(async (e, producto) => {
    e.stopPropagation();
    if (!token) { setShowAuth(true); return; }

    // Sin lista todavía: creamos una al vuelo para no frenar al usuario con un
    // formulario en el medio de agregar su primer producto.
    let listaId = listaActivaId;
    if (!listaId) {
      try {
        const res = await fetch(`${API}/listas`, {
          method:"POST",
          headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
          body: JSON.stringify({ nombre: "Mi lista" }),
        });
        if (!res.ok) return;
        listaId = (await res.json()).id;
        setListaActivaId(listaId);
      } catch (err) { return; }
    }

    const ean = producto.ean;
    const yaEsta = (ean && listaEans.has(ean)) || listaPids.has(producto.id);
    // Optimista: el backend guarda por EAN, así que replicamos esa identidad.
    setListaItems(prev => yaEsta
      ? prev.filter(i => !(ean ? i.ean === ean : i.producto_id === producto.id))
      : [...prev, { id:`tmp-${producto.id}`, ean: ean||null, producto_id: producto.id, cantidad:1 }]);
    try {
      const res = await fetch(`${API}/listas/${listaId}/items/${producto.id}`, {
        method:"POST", headers:{Authorization:`Bearer ${token}`},
      });
      if (!res.ok) throw new Error();
      cargarListas();
      cargarListaItems();
    } catch (err) {
      cargarListaItems();  // revertimos releyendo el estado real
    }
  }, [token, listaActivaId, listaEans, listaPids]);

  React.useEffect(() => {
    if (!token) { setCarritoItems([]); setListas([]); setListaItems([]); return; }
    cargarCarrito();
    cargarListas();
    fetch(`${API}/preferencia`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
        if (data && data.region_id) {
          setRegionId(data.region_id);
          localStorage.setItem("sp_region", data.region_id);
        }
        // Hidratar supers preferidos (null/[] = sin configurar → dejamos SUPER_TODOS)
        if (data && Array.isArray(data.supermercados) && data.supermercados.length) {
          const validos = data.supermercados.filter(s => SUPER_TODOS.includes(s));
          if (validos.length) {
            setSupersVisibles(validos);
            // La lista del servidor puede traer cadenas que no llegan a la región
            // guardada, así que el destildado tiene que volver a correr sobre ella.
            regionAplicadaRef.current = null;
          }
        }
      })
      .catch(() => {});
  }, [token]);

  // Persistir la preferencia de supers al cambiar (debounce). Se dispara SOLO por cambios de
  // supersVisibles (token vía ref, no como dependencia) para no pisar lo guardado al loguear.
  const tokenRef = React.useRef(token);
  tokenRef.current = token;
  const primerRenderSupers = React.useRef(true);
  React.useEffect(() => {
    if (primerRenderSupers.current) { primerRenderSupers.current = false; return; }
    const tk = tokenRef.current;
    if (tk) {
      const t = setTimeout(() => {
        fetch(`${API}/preferencia`, {
          method: "PUT",
          headers: { Authorization: `Bearer ${tk}`, "Content-Type": "application/json" },
          body: JSON.stringify({ supermercados: supersVisibles }),
        }).catch(() => {});
      }, 600);
      return () => clearTimeout(t);
    }
    localStorage.setItem("sp_supers", JSON.stringify(supersVisibles));
  }, [supersVisibles]);

  React.useEffect(() => {
    if (token && tab === "carrito") cargarCarrito();
  }, [tab, regionId]);

  React.useEffect(() => {
    if (productos.length > 0) {
      setProductosMap(prev => { const next={...prev}; productos.forEach(p => { next[p.id]=p; }); return next; });
    }
  }, [productos]);

  const cargarRef = React.useRef(null);

  async function cargar(paginaOverride) {
    if (cargarRef.current) cargarRef.current.abort();
    const controller = new AbortController();
    cargarRef.current = controller;
    const signal = controller.signal;
    setLoading(true);
    const paginaActual = paginaOverride !== undefined ? paginaOverride : pagina;
    const params = new URLSearchParams();
    if (superParam) params.append("supermercado", superParam);
    if (catFiltro !== "Todas") params.append("categoria", catFiltro);
    if (subcatFiltro !== "Todas") params.append("subcategoria", subcatFiltro);
    if (soloOfertas) params.append("ofertas", "true");
    if (tab === "favoritos") params.append("favoritos", "true");
    if (busqueda) params.append("busqueda", busqueda);
    params.append("pagina", paginaActual);
    params.append("por_pagina", porPagina);
    params.append("orden", orden);
    if (regionId) params.append("region_id", regionId);
    try {
      const headers = token ? {Authorization:`Bearer ${token}`} : {};
      const resp = await fetch(`${API}/productos?${params}`, {signal, headers}).then(r=>r.json());
      if (signal.aborted) return;
      const prods = resp.productos || [];
      setProductos(Array.isArray(prods)?prods:[]);
      setTotalProductos(resp.total||0);
      setTotalPaginas(resp.total_paginas||1);
      setBusquedaRelajada(resp.busqueda_relajada ? busqueda : null);
    } catch(e) { if (e.name==="AbortError") return; }
    setLoading(false);
  }

  React.useEffect(() => {
    const headers = token ? {Authorization:`Bearer ${token}`} : {};
    fetch(`${API}/stats`, {headers}).then(r=>r.json()).then(st=>setStats(st)).catch(()=>{});
  }, [token]);

  React.useEffect(() => {
    if (tab === "carrito" || tab === "lista" || tab === "cronograma") return;
    setPagina(1);
    const t = setTimeout(() => cargar(1), busqueda?400:0);
    return () => clearTimeout(t);
  }, [tab, superParam, catFiltro, subcatFiltro, soloOfertas, busqueda, token, orden, porPagina, regionId]);

  const toggleFav = React.useCallback(async (e, id) => {
    e.stopPropagation();
    if (!token) { setShowAuth(true); return; }
    setProductos(prev => prev.map(p => p.id===id ? {...p, favorito:!p.favorito} : p));
    const res = await fetch(`${API}/productos/${id}/favorito`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    const data = await res.json().catch(()=>({}));
    if (data.favorito !== undefined) setProductos(prev => prev.map(p => p.id===id ? {...p, favorito:data.favorito} : p));
    fetch(`${API}/stats`, {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()).then(st=>setStats(st)).catch(()=>{});
  }, [token]);

  const toggleCarrito = React.useCallback(async (e, producto) => {
    e.stopPropagation();
    if (!token) { setShowAuth(true); return; }
    const yaEsta = carritoItems.some(i => i.producto_id === producto.id);
    if (yaEsta) {
      setCarritoItems(prev => prev.filter(i => i.producto_id !== producto.id));
    } else {
      setCarritoItems(prev => [...prev, {producto_id:producto.id, cantidad:1}]);
      setProductosMap(prev => ({...prev, [producto.id]: producto}));
    }
    try {
      await fetch(`${API}/carrito/${producto.id}`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    } catch(err) {
      if (yaEsta) setCarritoItems(prev => [...prev, {producto_id:producto.id, cantidad:1}]);
      else setCarritoItems(prev => prev.filter(i => i.producto_id !== producto.id));
    }
  }, [token, carritoItems]);

  async function removeDelCarrito(producto_id) {
    setCarritoItems(prev => prev.filter(i => i.producto_id !== producto_id));
    try {
      await fetch(`${API}/carrito/${producto_id}`, {method:"POST", headers:{Authorization:`Bearer ${token}`}});
    } catch(err) {}
  }

  async function updateCantidad(producto_id, cantidad) {
    setCarritoItems(prev => prev.map(i => i.producto_id === producto_id ? {...i, cantidad} : i));
    try {
      await fetch(`${API}/carrito/${producto_id}`, {
        method: "PUT",
        headers: {Authorization:`Bearer ${token}`, "Content-Type":"application/json"},
        body: JSON.stringify({cantidad})
      });
    } catch(err) {
      fetch(`${API}/carrito`, {headers:{Authorization:`Bearer ${token}`}})
        .then(r => r.json()).then(data => { if (Array.isArray(data)) setCarritoItems(data); }).catch(()=>{});
    }
  }

  async function cambiarSuper(producto_id, nuevo_producto_id) {
    const anterior = carritoItems;
    setCarritoItems(prev => prev.map(i => i.producto_id === producto_id ? { ...i, producto_id: nuevo_producto_id } : i));
    try {
      const res = await fetch(`${API}/carrito/${producto_id}/cambiar-super`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ nuevo_producto_id })
      });
      if (!res.ok) throw new Error();
      cargarCarrito();
    } catch (err) {
      setCarritoItems(anterior);
    }
  }

  function cambiarPagina(p) { setPagina(p); cargar(p); window.scrollTo({top:0,behavior:"smooth"}); }
  function cambiarPorPagina(val) { setPorPagina(val); setPagina(1); }

  const totalCarrito = carritoItems.length;

  function cerrarWelcome() {
    try { localStorage.setItem("sp_welcome_v1", "1"); } catch {}
    setShowWelcome(false);
  }

  function resetFilters() {
    // No reseteamos supersVisibles: es una preferencia persistente del usuario, no un filtro transitorio.
    setTab("todos"); setCatFiltro("Todas"); setSubcatFiltro("Todas");
    setBusqueda(""); setSoloOfertas(false); window.scrollTo({top:0,behavior:"smooth"});
  }

  return (
    <div>
      {showWelcome && <WelcomeModal onClose={cerrarWelcome}/>}
      {legalTab && <LegalModal initialTab={legalTab} onClose={()=>setLegalTab(null)}/>}
      {showAuth && <AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin}/>}
      {modalProducto && <Modal producto={modalProducto} onClose={()=>setModalProducto(null)} supersFiltro={supersVisibles}/>}

      {/* Header */}
      <header className="header">
        <div className="header-inner">
          <a className="header-brand" onClick={resetFilters}>
            <div className="header-brand-icon">🛒</div>
            <div className="header-brand-text">
              <div className="header-brand-title">Super<span>Precios</span> AR</div>
              <div className="header-brand-sub">Compará precios entre {SUPER_TODOS.length} supermercados</div>
            </div>
          </a>

          <div className="header-search-wrap">
            <span>🔍</span>
            <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar productos..."/>
          </div>

          <div className="header-actions">
            {regiones.length > 0 && (
              <select value={regionId||""} onChange={e=>cambiarRegion(e.target.value?Number(e.target.value):null)}
                title="Ver precios de tu región" className="region-select">
                <option value="">📍 Sin región</option>
                {regiones.map(r => <option key={r.id} value={r.id}>📍 {r.nombre}</option>)}
              </select>
            )}

            <button className={`header-btn ${tab==="favoritos"?"active":""}`} onClick={()=>{if(!token){setShowAuth(true);return;}setTab("favoritos");}}>
              ❤️<span className="btn-label">Favoritos</span>
              {stats.favoritos > 0 && <span className="header-btn-badge pink">{stats.favoritos}</span>}
            </button>

            <button className={`header-btn ${tab==="lista"?"active":""}`} onClick={()=>{if(!token){setShowAuth(true);return;}setTab("lista");}}>
              📋<span className="btn-label">Mi lista</span>
              {listaItems.length > 0 && <span className="header-btn-badge">{listaItems.length}</span>}
            </button>

            <button className={`header-btn ${tab==="carrito"?"active":""}`} onClick={()=>{if(!token){setShowAuth(true);return;}setTab("carrito");}}>
              🛒<span className="btn-label">Carrito</span>
              {totalCarrito > 0 && <span className="header-btn-badge yellow">{totalCarrito}</span>}
            </button>

            {usuario ? (
              <div className="header-user">
                <span className="header-user-email">{usuario.email}</span>
                <button className="header-user-btn ghost" onClick={handleLogout}>Salir</button>
              </div>
            ) : (
              <button className="header-user-btn" onClick={()=>setShowAuth(true)}>Iniciar sesión</button>
            )}
          </div>
        </div>
      </header>

      {/* Main */}
      <div className="main">
        {/* Sidebar - solo en pestañas de productos */}
        {tab !== "carrito" && tab !== "cronograma" && (
          <aside className={`sidebar ${sidebarOpen?"open":""}`}>
            <Sidebar
              supersVisibles={supersVisibles} setSupersVisibles={setSupersVisibles}
              catFiltro={catFiltro} setCatFiltro={setCatFiltro}
              subcatFiltro={subcatFiltro} setSubcatFiltro={setSubcatFiltro}
              soloOfertas={soloOfertas} setSoloOfertas={setSoloOfertas}
              stats={stats}
              regionCodigo={regionCodigo}
            />
          </aside>
        )}

        <div className="content">
          {/* Barra: "Todos los productos" + logos de supermercados en movimiento */}
          <div className="brandbar">
            <div className="brandbar-top">
              <div className="tabs">
                <button className={`tab ${tab==="todos"?"active":""}`} onClick={()=>setTab("todos")}>
                  🏪 Todos los productos
                </button>
                {/* Sin guarda de token a propósito: es la vista con la que se
                    entra, y pedirle cuenta a alguien que todavía no sabe para
                    qué sirve la app es justo lo que queremos evitar. */}
                <button className={`tab ${tab==="cronograma"?"active":""}`} onClick={()=>setTab("cronograma")}>
                  📅 Descuentos de la semana
                </button>
              </div>
              {tab !== "carrito" && tab !== "cronograma" && (
                <button className="mobile-filter-toggle" onClick={()=>setSidebarOpen(!sidebarOpen)}>
                  ⚙️ {sidebarOpen ? "Ocultar filtros" : "Mostrar filtros"}
                </button>
              )}
            </div>
            <div className="logos-marquee">
              <span className="logos-label">Comparás precios en</span>
              <div className="logos-viewport">
                <div className="logos-track" aria-hidden="true">
                  {/* Cuatro copias: la animación corre hasta -50%, o sea dos copias
                      exactas, y las otras dos son las que quedan llenando a la
                      derecha hasta el reinicio. Tiene que ser un número PAR o el
                      -50% cae en el medio de una copia y el salto se ve. */}
                  {[...SUPER_TODOS, ...SUPER_TODOS, ...SUPER_TODOS, ...SUPER_TODOS].map((s, i) => (
                    <span className="logos-item" key={i}>
                      {/* Cordiez usa `recorte`: es un wordmark metido en un lienzo
                          cuadrado con relleno arriba y abajo (ver comentario en
                          SuperLogo), así que necesita `cover` en vez de más altura —
                          más altura solo agranda el relleno junto con el texto. */}
                      {s === "Cordiez"
                        ? <SuperLogo nombre={s} ancho={110} recorte={4.3} bare={true} ya={true}/>
                        : <SuperLogo nombre={s} size={38} ancho="auto" maxAncho={130} bare={true} ya={true}/>}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {tab === "cronograma" ? (
            <CronogramaView regionCodigo={regionCodigo} token={token}
                            onPedirCuenta={()=>setShowAuth(true)}/>
          ) : tab === "carrito" ? (
            <CarritoView carritoItems={carritoItems} productosMap={productosMap} onRemove={removeDelCarrito} onUpdateCantidad={updateCantidad} onCambiarSuper={cambiarSuper} token={token} regionCodigo={regionCodigo}/>
          ) : tab === "lista" ? (
            <ListaView
              token={token}
              regionId={regionId}
              regionCodigo={regionCodigo}
              supersVisibles={supersVisibles}
              listas={listas}
              listaActivaId={listaActivaId}
              setListaActivaId={setListaActivaId}
              onListasChange={() => { cargarListas(); cargarListaItems(); }}
              carritoIds={carritoIds}
              onCarritoChange={cargarCarrito}
            />
          ) : (
            <>
              {/* Stats */}
              <div className="stats-bar">
                <div className="stat-card" onClick={resetFilters}>
                  <div className="stat-value accent">{stats.total_productos||0}</div>
                  <div className="stat-label">Precios monitoreados</div>
                </div>
                <div className="stat-card" onClick={()=>{if(!token){setShowAuth(true);return;}setTab("favoritos");}}>
                  <div className="stat-value success">{stats.favoritos||0}</div>
                  <div className="stat-label">En tu lista de favoritos</div>
                </div>
                <div className="stat-card" onClick={()=>{if(!token){setShowAuth(true);return;}setTab("carrito");}}>
                  <div className="stat-value">{totalCarrito}</div>
                  <div className="stat-label">En tu carrito</div>
                </div>
              </div>

              {/* Sort bar */}
              <div className="sort-bar">
                <span className="sort-info">
                  {loading ? "Cargando..." : <><strong>{totalProductos}</strong> producto{totalProductos!==1?"s":""} · página <strong>{pagina}</strong> de <strong>{totalPaginas}</strong></>}
                </span>
                <div className="sort-controls" style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                  <div className="sort-options">
                    {[ ["popular","Más populares"],["precio-asc","Precio ↑"],["precio-desc","Precio ↓"],["descuento","Mayor descuento"],["reciente","Más reciente"] ].map(([key,label]) => (
                      <button key={key} className={`sort-btn ${orden===key?"active":""}`} onClick={()=>setOrden(key)}>{label}</button>
                    ))}
                  </div>
                  <div className="per-page">
                    <span>Mostrar:</span>
                    {[30,60,120,240].map(val => (
                      <button key={val} onClick={()=>cambiarPorPagina(val)} className={`sort-btn ${porPagina===val?"active":""}`} style={{padding:"4px 10px",fontSize:11}}>{val}</button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Aviso: la API no encontró nada con todas las palabras y relajó una */}
              {busquedaRelajada && !loading && productosVisibles.length > 0 && (
                <div className="search-notice">
                  <span className="search-notice-icon">💡</span>
                  <span>
                    No encontramos productos con todas las palabras de <strong>“{busquedaRelajada}”</strong>.
                    Estos son los más parecidos, así que puede faltarles alguna.
                  </span>
                </div>
              )}

              {/* Grid */}
              {supersVisibles.length===0 && !loading ? (
                <div className="empty-state">
                  <div className="empty-state-icon">🛒</div>
                  <div className="empty-state-title">No hay supermercados seleccionados</div>
                  <div className="empty-state-desc">Marcá al menos un supermercado en el panel de la izquierda para ver productos.</div>
                </div>
              ) : productosVisibles.length===0 && !loading ? (
                <div className="empty-state">
                  <div className="empty-state-icon">🧐</div>
                  <div className="empty-state-title">No encontramos productos</div>
                  <div className="empty-state-desc">Probá con otros filtros o términos de búsqueda. También podés reiniciar los filtros haciendo clic en el logo.</div>
                </div>
              ) : (
                <>
                  <div className="grid">
                    {loading ? (
                      Array.from({length:8}).map((_,i) => (
                        <div key={i} className="product-card" style={{pointerEvents:"none"}}>
                          <div className="card-image-wrap"><div className="skeleton" style={{width:"100%",height:160}}/></div>
                          <div className="card-body">
                            <div className="skeleton" style={{width:"40%",height:14}}/>
                            <div className="skeleton" style={{width:"100%",height:36,marginTop:8}}/>
                            <div className="skeleton" style={{width:"60%",height:24,marginTop:8}}/>
                          </div>
                        </div>
                      ))
                    ) : (
                      productosVisibles.map(p => (
                        <ProductCard
                          key={p.id}
                          p={p}
                          enCarrito={carritoItems.some(i => i.producto_id===p.id)}
                          enLista={(p.ean && listaEans.has(p.ean)) || listaPids.has(p.id)}
                          onFav={toggleFav}
                          onCarrito={toggleCarrito}
                          onLista={toggleLista}
                          onOpen={setModalProducto}
                          supersVisibles={supersVisibles}
                          regionCodigo={regionCodigo}
                        />
                      ))
                    )}
                  </div>
                  <Paginacion paginaActual={pagina} totalPaginas={totalPaginas} onCambiar={cambiarPagina}/>
                </>
              )}

              <div className="footer">
                <p className="footer-text">
                  <strong>Actualización automática:</strong> todos los días a las 06:00 y 18:00 hs.<br/>
                  Agregá productos a ❤️ <strong>favoritos</strong> para recibir alertas cuando bajen de precio.<br/>
                  Usá 🛒 <strong>carrito</strong> para armar tu compra y ejecutarla directo en el supermercado que elijas.
                </p>
                <button className="footer-link-btn" onClick={()=>setShowWelcome(true)}>💡 ¿Cómo funciona? Ver la guía rápida</button>
                <div className="footer-legal">
                  <button onClick={()=>setLegalTab("terminos")}>Términos y Condiciones</button>
                  <span>·</span>
                  <button onClick={()=>setLegalTab("privacidad")}>Política de Privacidad</button>
                  <span>·</span>
                  <button onClick={()=>setLegalTab("descargos")}>Descargos y marcas</button>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
