<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperPrecios AR — Compará y ahorrá en tu supermercado</title>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F5F8;
      --surface: #FFFFFF;
      --surface-elevated: #FFFFFF;
      --surface-2: #FAFBFC;
      --border: #E6E8EC;
      --border-light: #EEF0F3;
      --text-primary: #0E1524;
      --text-secondary: #59616F;
      --text-muted: #98A1AF;
      --accent: #FFD600;
      --accent-dark: #D9AE00;
      --accent-soft: #FFF6C9;
      --ink: #131A28;
      --danger: #EF4444;
      --danger-light: #FEF2F2;
      --success: #16A34A;
      --success-light: #EFFCF3;
      --info: #3B82F6;
      --info-light: #EFF6FF;
      --warning: #F59E0B;
      --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
      --shadow: 0 1px 3px rgba(16,24,40,0.06), 0 6px 16px -6px rgba(16,24,40,0.10);
      --shadow-lg: 0 10px 28px -8px rgba(16,24,40,0.16), 0 2px 6px rgba(16,24,40,0.05);
      --shadow-xl: 0 28px 56px -14px rgba(16,24,40,0.24);
      --radius-sm: 9px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --ring: 0 0 0 3px rgba(255,214,0,0.30);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(1100px 520px at 100% -8%, rgba(255,214,0,0.10), transparent 58%),
        radial-gradient(900px 460px at -8% -4%, rgba(59,130,246,0.05), transparent 55%);
      background-attachment: fixed;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: var(--accent); color: #1b1600; }
    :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D2D7DE; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #B4BCC7; background-clip: padding-box; }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 0;
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      background: rgba(255,255,255,0.80);
    }
    .header-inner {
      max-width: 1320px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .header-brand {
      display: flex; align-items: center; gap: 11px; cursor: pointer;
      text-decoration: none; user-select: none;
    }
    .header-brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(145deg, #FFE45C 0%, var(--accent) 45%, #FFC400 100%);
      border-radius: 13px; display: flex; align-items: center; justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 12px -2px rgba(224,178,0,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .header-brand:hover .header-brand-icon { transform: rotate(-6deg) scale(1.05); }
    .header-brand-text { display: flex; flex-direction: column; }
    .header-brand-title { font-size: 17px; font-weight: 900; letter-spacing: -0.5px; color: var(--text-primary); line-height: 1.2; }
    .header-brand-title span { color: var(--accent-dark); }
    .header-brand-sub { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }

    .header-search-wrap { flex: 1; max-width: 520px; position: relative; }
    .header-search-wrap span { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); pointer-events: none; }
    .header-search-wrap input {
      width: 100%; padding: 11px 16px 11px 42px; font-size: 13.5px;
      border: 1.5px solid var(--border); border-radius: 999px;
      background: var(--surface-2); outline: none; font-family: inherit; font-weight: 500;
      color: var(--text-primary);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .header-search-wrap input:hover { border-color: #D3D8DF; }
    .header-search-wrap input:focus { border-color: var(--accent); background: var(--surface); box-shadow: var(--ring); }
    .header-search-wrap input::placeholder { color: var(--text-muted); font-weight: 500; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-btn {
      display: flex; align-items: center; gap: 6px; padding: 9px 14px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 12.5px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
      font-family: inherit; position: relative;
    }
    .header-btn:hover { border-color: #D3D8DF; color: var(--text-primary); background: var(--surface-2); transform: translateY(-1px); }
    .header-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--shadow); }
    .header-btn-badge {
      position: absolute; top: -6px; right: -6px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; font-size: 10px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(16,24,40,0.18); border: 2px solid var(--surface);
  
      background: var(--info); color: #fff;
    }
    .header-btn-badge.yellow { background: var(--accent); color: #000; }
    .header-btn-badge.pink { background: var(--danger); color: #fff; }

    .header-user { display: flex; align-items: center; gap: 10px; }
    .header-user-email { font-size: 12px; color: var(--text-secondary); font-weight: 600; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-user-btn {
      padding: 8px 14px; border-radius: var(--radius); border: none;
      background: var(--accent); color: #1b1600; font-size: 12.5px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      box-shadow: 0 2px 8px -2px rgba(224,178,0,0.5);
    }
    .header-user-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(224,178,0,0.55); }
    .header-user-btn.ghost {
      background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border); box-shadow: none;
    }
    .header-user-btn.ghost:hover { background: var(--surface-2); color: var(--text-primary); }

    /* Region selector */
    .region-select {
      padding: 9px 12px; border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 12px; font-weight: 700; color: var(--text-secondary);
      cursor: pointer; outline: none; font-family: inherit; transition: all 0.15s;
    }
    .region-select:hover { border-color: #D3D8DF; color: var(--text-primary); }
    .region-select:focus { border-color: var(--accent); box-shadow: var(--ring); }

    /* Main layout */
    .main { max-width: 1320px; margin: 0 auto; padding: 20px; display: flex; gap: 20px; }
    .sidebar { width: 260px; flex-shrink: 0; }
    .content { flex: 1; min-width: 0; }

    @media (max-width: 1024px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; }
    }
    @media (max-width: 768px) {
      .header-inner { flex-wrap: wrap; }
      .header-search-wrap { order: 3; max-width: 100%; width: 100%; }
      .main { padding: 12px; }

      /* Desde acá .header-actions cae en su propia fila, pero se seguía midiendo
         por su contenido y se desbordaba de la pantalla: es un flex item y sin
         min-width:0 no baja de su min-content, así que ningún hijo renegocia el
         ancho. Con esto la fila manda y el sobrante se reparte abajo.
         El email es lo primero que sale: es el dato menos accionable de la fila
         y el que más ancho pide (hasta 170px). Sin él entra todo sin recortar
         hasta 640px, donde además se caen las etiquetas de los botones.
         Quien cede después es el <select>, único con texto elástico y el que
         mejor tolera el recorte (el nombre completo se ve al desplegarlo). Los
         botones de sesión NO ceden: al encogerse, "Iniciar sesión" parte en dos
         renglones y agranda toda la fila. */
      .header-user-email { display: none; }
      .header-actions { min-width: 0; }
      .region-select { min-width: 0; }
      .header-user, .header-user-btn { flex-shrink: 0; white-space: nowrap; }
    }
    /* Piso del encogimiento del <select>. Deslogueado el botón "Iniciar sesión"
       ocupa 110px, así que al select le quedan (ancho - 287)px: a 375px son 88 y
       todavía se lee "📍 Santa F", pero a 360 —un Android muy común— caen a 73 y
       a 320 a 33, donde ni el 📍 entra y el control queda como una flechita sola.
       Debajo de 360 la fila directamente no da para cinco controles, así que el
       select se lleva un renglón entero y los íconos + sesión quedan abajo
       (mismo criterio que .card-actions). Los íconos sí se reconocen sueltos. */
    @media (max-width: 360px) {
      .header-actions { flex-wrap: wrap; }
      .region-select { flex: 1 1 100%; }
    }

    /* Sidebar filters — scrollea junto con la página (no queda fijo), así los
       filtros de abajo como "Solo ofertas" se alcanzan sin recorrer todos los productos */
    .sidebar { align-self: flex-start; }
    .filter-card {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border); padding: 14px;
      box-shadow: var(--shadow-sm); margin-bottom: 12px;
    }
    .filter-title {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 10px; padding: 0 4px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 2px; }
    .filter-chip {
      display: flex; align-items: center; gap: 9px; padding: 8px 11px;
      border-radius: 10px; border: none; background: transparent;
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      cursor: pointer; transition: all 0.14s; font-family: inherit; text-align: left;
      position: relative;
    }
    .filter-chip:hover { background: var(--surface-2); color: var(--text-primary); }
    .filter-chip.active { background: var(--ink); color: #fff; box-shadow: var(--shadow-sm); }
    .filter-chip.active::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 16px; border-radius: 3px; background: var(--accent);
    }
    .filter-chip .dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.04);
    }
    .filter-chip .count {
      margin-left: auto; font-size: 11px; font-weight: 800;
      padding: 1px 7px; border-radius: 10px; background: var(--surface-2);
      color: var(--text-muted); border: 1px solid var(--border-light);
    }
    .filter-chip.active .count { background: rgba(255,255,255,0.16); color: #fff; border-color: transparent; }

    /* Selección múltiple de supermercados (checkboxes) */
    .filter-hint { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin: -4px 4px 10px; font-weight: 500; }
    .filter-checks { display: flex; flex-direction: column; gap: 1px; }
    .filter-check {
      display: flex; align-items: center; gap: 10px; padding: 7px 10px;
      border-radius: 10px; cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      transition: background 0.14s, color 0.14s;
    }
    .filter-check:hover { background: var(--surface-2); color: var(--text-primary); }
    .filter-check.on { color: var(--text-primary); }
    .filter-check input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; flex-shrink: 0; margin: 0;
      border: 1.5px solid var(--border); border-radius: 6px;
      background: var(--surface); cursor: pointer; position: relative;
      transition: background 0.14s, border-color 0.14s;
    }
    .filter-check input[type="checkbox"]:hover { border-color: var(--accent-dark); }
    .filter-check input[type="checkbox"]:checked,
    .filter-check input[type="checkbox"]:indeterminate { background: var(--ink); border-color: var(--ink); }
    .filter-check input[type="checkbox"]:checked::after {
      content: ""; position: absolute; left: 5px; top: 1px;
      width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .filter-check input[type="checkbox"]:indeterminate::after {
      content: ""; position: absolute; left: 3.5px; top: 6.5px;
      width: 9px; height: 2px; background: #fff; border-radius: 1px;
    }
    .filter-check img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
    .filter-check-name { white-space: nowrap; }
    .filter-check .count {
      margin-left: auto; font-size: 11px; font-weight: 800;
      padding: 1px 7px; border-radius: 10px; background: var(--surface-2);
      color: var(--text-muted); border: 1px solid var(--border-light);
    }
    .filter-check.master {
      border-bottom: 1px solid var(--border-light); border-radius: 0;
      margin-bottom: 4px; padding-bottom: 9px; font-weight: 800; color: var(--text-primary);
    }
    /* Cadena que no vende en la región elegida: se atenúa pero sigue tildable,
       porque el precio sirve de referencia aunque no se pueda comprar. */
    .filter-check.sin-cobertura { opacity: 0.55; }
    .filter-check.sin-cobertura:hover { opacity: 1; }
    .filter-check.sin-cobertura img { filter: grayscale(1); }
    .filter-check.sin-cobertura.on img { filter: none; }
    .filter-check-tag {
      margin-left: auto; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em;
      text-transform: uppercase; padding: 1px 6px; border-radius: 8px;
      background: var(--surface-2); color: var(--text-muted);
      border: 1px solid var(--border-light); white-space: nowrap;
    }
    /* Con la etiqueta presente el contador pierde el margin-left:auto (ya lo
       tomó la etiqueta) y quedaría pegado; se lo separa a mano. */
    .filter-check-tag + .count { margin-left: 5px; }

    .filter-toggle {
      display: flex; align-items: center; gap: 11px; padding: 9px 11px;
      border-radius: 10px; cursor: pointer; transition: all 0.15s;
    }
    .filter-toggle:hover { background: var(--surface-2); }
    .toggle-track {
      width: 38px; height: 22px; border-radius: 11px; background: #D7DBE1;
      position: relative; transition: background 0.22s; flex-shrink: 0;
    }
    .toggle-track.on { background: var(--danger); }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transition: left 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toggle-track.on .toggle-thumb { left: 18px; }
    .toggle-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .toggle-label.on { color: var(--danger); }

    /* Sort bar */
    .sort-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .sort-info { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .sort-info strong { color: var(--text-primary); font-weight: 800; }
    .sort-options { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; background: var(--surface); padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .sort-btn {
      padding: 6px 12px; border-radius: 8px; border: none;
      background: transparent; font-size: 12px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: all 0.14s;
      font-family: inherit;
    }
    .sort-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .sort-btn.active { background: var(--ink); color: #fff; box-shadow: var(--shadow-sm); }
    .per-page { display: flex; align-items: center; gap: 4px; background: var(--surface); padding: 4px 4px 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .per-page span { font-size: 11px; color: var(--text-muted); font-weight: 700; }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
      gap: 16px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    /* Product Card */
    .product-card {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border-light); overflow: hidden;
      box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), box-shadow 0.22s, border-color 0.22s;
      cursor: pointer; position: relative;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border);
    }
    .product-card.offer { border-color: rgba(239,68,68,0.18); }
    .product-card.offer::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 2px 0 rgba(239,68,68,0.5); opacity: 0; transition: opacity 0.22s;
    }
    .product-card.offer:hover { border-color: rgba(239,68,68,0.35); }
    .product-card.offer:hover::before { opacity: 1; }

    .card-image-wrap {
      position: relative; padding: 30px 16px 8px;
      background: linear-gradient(180deg, #F7F8FA 0%, var(--surface) 100%);
    }
    .card-image {
      width: 100%; height: 150px; object-fit: contain;
      border-radius: var(--radius-sm); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      mix-blend-mode: multiply;
    }
    .product-card:hover .card-image { transform: scale(1.05); }
    .card-badges-top {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none;
    }
    .card-badge-super {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(6px);
      padding: 6px 12px 6px 7px; border-radius: 22px;
      box-shadow: 0 1px 5px rgba(16,24,40,0.10); border: 1px solid rgba(255,255,255,0.8);
      pointer-events: auto;
    }
    .card-badge-super img { width: 24px; height: 24px; object-fit: contain; }
    .card-badge-super span { font-size: 13.5px; font-weight: 800; color: var(--text-primary); }
    .card-badge-time {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      background: rgba(255,255,255,0.85); padding: 3px 8px;
      border-radius: 10px; backdrop-filter: blur(6px);
    }
    .card-discount-inline {
      background: linear-gradient(135deg, #FF5A5A, #E23434); color: #fff;
      font-size: 11px; font-weight: 900; padding: 3px 9px; letter-spacing: 0.2px;
      border-radius: 20px; box-shadow: 0 4px 10px -2px rgba(226,52,52,0.45);
      white-space: nowrap;
    }

    .card-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
    .card-category {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-muted);
    }
    .card-name {
      font-size: 15.5px; font-weight: 700; color: var(--text-primary);
      line-height: 1.34; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; min-height: 42px;
      letter-spacing: -0.2px;
    }

    .card-price-block { display: flex; align-items: center; gap: 8px; }
    .card-price {
      font-size: 23px; font-weight: 900; letter-spacing: -0.9px; color: var(--text-primary);
    }
    .card-price.offer { color: var(--danger); }
    /* Columna derecha: descuento arriba, precio tachado abajo (para que no compitan
       por el renglón con precios de 5-6 cifras) */
    .card-price-side {
      margin-left: auto; display: flex; flex-direction: column;
      align-items: flex-end; gap: 3px; flex-shrink: 0;
    }
    .card-price-old {
      font-size: 12px; color: var(--text-muted); text-decoration: line-through;
      font-weight: 500; line-height: 1;
    }
    .card-promo {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 800; padding: 4px 10px;
      border-radius: 20px; letter-spacing: 0.3px; text-transform: uppercase;
      color: #fff; width: fit-content; box-shadow: 0 2px 6px -1px rgba(16,24,40,0.25);
    }
    .card-region {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 800; color: var(--info);
      background: var(--info-light); padding: 3px 8px;
      border-radius: 10px; width: fit-content;
    }

    /* Price comparison strip */
    .card-compare {
      background: var(--surface-2); border: 1px solid var(--border-light);
      border-radius: 11px; padding: 8px 10px; margin-top: 2px;
    }
    .card-compare-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0; font-size: 11.5px;
      text-decoration: none; color: inherit; cursor: pointer; border-radius: 6px;
      transition: background 0.15s;
    }
    .card-compare-row:hover { background: rgba(16,24,40,0.04); }
    .card-compare-row:hover .card-compare-name { text-decoration: underline; }
    .card-compare-name {
      display: flex; align-items: center; gap: 6px; font-weight: 700;
      color: var(--text-secondary);
    }
    .card-compare-name img { width: 14px; height: 14px; object-fit: contain; }
    .card-compare-price { font-weight: 800; color: var(--text-secondary); }
    .card-compare-price.worse { color: var(--text-muted); }
    .card-compare-row.cheaper .card-compare-name,
    .card-compare-price.cheaper { color: #B45309; }
    .card-compare-more {
      font-size: 10.5px; color: var(--text-muted); text-align: center;
      margin-top: 4px; font-weight: 600;
    }
    .card-compare-savings {
      font-size: 10.5px; font-weight: 800; color: var(--success);
      margin-top: 5px; text-align: center; background: var(--success-light);
      padding: 4px; border-radius: 8px;
    }
    .card-compare-savings.cheaper { color: #B45309; background: #FFF7ED; }

    /* Card actions */
    .card-actions {
      display: flex; gap: 8px; margin-top: auto; padding-top: 10px;
    }
    .card-btn {
      flex: 1; padding: 10px; border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 12.5px; font-weight: 800;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
      font-family: inherit; display: flex; align-items: center;
      justify-content: center; gap: 5px;
    }
    .card-btn:hover { background: var(--surface-2); border-color: #D3D8DF; color: var(--text-primary); }
    .card-btn.primary {
      background: var(--ink); color: #fff; border-color: var(--ink);
    }
    .card-btn.primary:hover { background: #000; transform: translateY(-1px); box-shadow: var(--shadow); }
    .card-btn.accent {
      background: var(--accent); color: #1b1600; border-color: var(--accent);
    }
    .card-btn.accent:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 6px 14px -4px rgba(224,178,0,0.5); }
    /* Utilidad: texto que solo aparece cuando hay ancho. En desktop la tarjeta
       arranca en 258px y sobran ~88px por botón (alcanza para una palabra); a
       <=640px la grilla pasa a 2 tarjetas por fila (~170px) y ahí NO entra
       texto, así que quedan como íconos. Mismo truco que .logos-label.
       También la usan los botones del header y los de la grilla de listas. */
    .btn-label { white-space: nowrap; }
    @media (max-width: 640px) {
      .btn-label { display: none; }

      /* El header ya viene acomodado desde 768px (ver ese bloque); acá solo
         apretamos un poco para que al <select> le quede más texto visible: a
         375px eran 335px útiles contra 388px pedidos. Los 14px laterales del
         botón estaban calculados para el botón CON etiqueta, y a esta altura la
         etiqueta ya no está — los 6px que devuelve cada uno, más los 2px por
         gap, se los lleva el nombre de la región. */
      .header-actions { gap: 6px; }
      .header-btn { padding: 9px 11px; }

      /* Las TARJETAS son la excepción: acá las etiquetas se quedan. Un 🛒 pelado
         se lee como "ir al carrito", no como "agregar", y agregar es la acción
         principal de la tarjeta. Como a 2 tarjetas por fila (~146px útiles) no
         entran tres botones con texto, dejamos que la fila envuelva: favorito y
         lista arriba, agregar al carrito a lo ancho abajo. */
      .card-actions { flex-wrap: wrap; }
      .card-btn.buy { flex: 1 1 100%; }
      .card-btn .btn-label { display: inline; }
    }
    .card-btn.fav { flex: 0 0 42px; padding: 10px 0; font-size: 14px; }
    .card-btn.fav:hover { background: var(--danger-light); border-color: rgba(239,68,68,0.25); }
    .card-btn.fav.active { background: var(--danger-light); border-color: rgba(239,68,68,0.25); }

    /* Aviso de búsqueda relajada */
    .search-notice {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--info-light); border: 1px solid rgba(59,130,246,0.22);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
      font-size: 13px; color: var(--text-secondary); line-height: 1.55;
    }
    .search-notice strong { color: var(--text-primary); font-weight: 700; }
    .search-notice-icon { font-size: 15px; line-height: 1.4; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 80px 20px; background: var(--surface);
      border-radius: var(--radius-lg); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .empty-state-icon { font-size: 56px; margin-bottom: 16px; filter: saturate(1.1); }
    .empty-state-title { font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; }
    .empty-state-desc { font-size: 13.5px; color: var(--text-secondary); max-width: 360px; margin: 0 auto; line-height: 1.6; }

    /* Pagination */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; margin-top: 32px; flex-wrap: wrap;
    }
    .page-btn {
      min-width: 38px; height: 38px; padding: 0 10px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 13px; font-weight: 800;
      color: var(--text-secondary); cursor: pointer; transition: all 0.14s;
      font-family: inherit; display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover:not(:disabled) { border-color: #D3D8DF; color: var(--text-primary); background: var(--surface-2); transform: translateY(-1px); }
    .page-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--shadow-sm); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-input-wrap { display: flex; align-items: center; gap: 6px; margin-left: 4px; }
    .page-input-wrap span { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .page-input {
      width: 50px; height: 38px; padding: 0 4px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 13px; font-weight: 800;
      text-align: center; font-family: inherit; outline: none; color: var(--text-primary);
    }
    .page-input:focus { border-color: var(--accent); box-shadow: var(--ring); }

    /* Footer */
    .footer {
      margin-top: 40px; padding: 24px;
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow-sm);
    }
    .footer-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.8; max-width: 620px; margin: 0 auto; }
    .footer-text strong { color: var(--text-primary); font-weight: 700; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(11,17,28,0.55);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 16px; backdrop-filter: blur(6px);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface); border-radius: var(--radius-xl);
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-xl); animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255,255,255,0.6);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; padding: 24px 24px 0;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--text-primary); line-height: 1.4; }
    .modal-close {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--surface-2); color: var(--text-muted); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .modal-close:hover { background: var(--danger-light); color: var(--danger); transform: rotate(90deg); }
    .modal-body { padding: 20px 24px 24px; }
    .modal-section-title {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted); margin: 22px 0 10px;
    }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
      padding: 13px 20px; background: var(--ink); color: #fff;
      border-radius: var(--radius); font-size: 13px; font-weight: 800;
      text-decoration: none; transition: all 0.15s; width: 100%; justify-content: center;
    }
    .modal-link:hover { background: #000; transform: translateY(-1px); box-shadow: var(--shadow); }

    /* Welcome / onboarding modal */
    .welcome-modal {
      background: var(--surface); border-radius: var(--radius-xl); position: relative;
      width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
      box-shadow: var(--shadow-xl); animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    .welcome-close { position: absolute; top: 14px; right: 14px; z-index: 2; }
    .welcome-hero {
      text-align: center; padding: 34px 28px 22px;
      background:
        radial-gradient(620px 210px at 50% -25%, rgba(255,214,0,0.28), transparent 70%),
        linear-gradient(180deg, var(--accent-soft), var(--surface));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }
    .welcome-icon {
      width: 62px; height: 62px; margin: 0 auto 14px;
      background: linear-gradient(145deg, #FFE45C 0%, var(--accent) 45%, #FFC400 100%);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 31px; box-shadow: 0 8px 22px -4px rgba(224,178,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .welcome-title { font-size: 22px; font-weight: 900; letter-spacing: -0.6px; color: var(--text-primary); line-height: 1.2; }
    .welcome-title span { color: var(--accent-dark); }
    .welcome-sub { font-size: 13.5px; color: var(--text-secondary); margin: 8px auto 0; line-height: 1.55; max-width: 370px; font-weight: 500; }
    .welcome-steps { padding: 20px 24px 4px; display: flex; flex-direction: column; gap: 13px; }
    .welcome-step { display: flex; gap: 13px; align-items: flex-start; }
    .welcome-step-ico {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }
    .welcome-step-t { font-size: 14px; font-weight: 800; color: var(--text-primary); }
    .welcome-step-d { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 1px; }
    .welcome-savings {
      margin: 16px 24px 0; padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start;
      background: var(--success-light); border: 1px solid rgba(22,163,74,0.22); border-radius: var(--radius);
      font-size: 12.5px; color: #166534; line-height: 1.55;
    }
    .welcome-savings strong { color: #14532d; font-weight: 800; }
    .welcome-savings-emoji { font-size: 18px; flex-shrink: 0; line-height: 1.4; }

    /* Promos bancarias en el onboarding. Va en el violeta del selector de medios
       de pago, que es adonde lleva: el color hace de hilo entre los dos. */
    .welcome-bancos {
      margin: 12px 24px 0; padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start;
      background: rgba(124,58,237,0.06); border: 1px solid rgba(124,58,237,0.22);
      border-radius: var(--radius); font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
    }
    .welcome-bancos strong { color: var(--text-primary); font-weight: 800; }
    .welcome-bancos-emoji { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
    .welcome-bancos-logos {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 11px;
    }
    .welcome-bancos-mas { font-size: 11.5px; font-weight: 800; color: var(--text-muted); }
    /* El botón se pega abajo del modal. Con los cinco pasos, el bloque de ahorro
       y el de bancos el contenido pasa de 900px, y el modal está topeado en 92vh:
       sin esto el CTA del onboarding queda fuera de pantalla hasta que el usuario
       scrollea. En pantallas donde todo entra, `sticky` no hace nada. El pie
       lleva el fondo del modal para que el contenido no se vea pasar por debajo. */
    .welcome-pie {
      position: sticky; bottom: 0; background: var(--surface);
      box-shadow: 0 -14px 14px -14px rgba(0,0,0,0.14);
    }
    .welcome-cta {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin: 16px 24px 20px; width: calc(100% - 48px);
      padding: 14px; border: none; border-radius: var(--radius);
      background: var(--ink); color: var(--accent); font-size: 15px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .welcome-cta:hover { background: #000; transform: translateY(-1px); box-shadow: var(--shadow); }

    .footer-link-btn {
      margin-top: 14px; background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 12.5px; font-weight: 700; color: var(--text-secondary); text-decoration: underline;
      text-underline-offset: 2px; transition: color 0.15s;
    }
    .footer-link-btn:hover { color: var(--accent-dark); }

    .footer-legal { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .footer-legal span { color: var(--border); font-size: 11px; }
    .footer-legal button {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-decoration: underline;
      text-underline-offset: 2px; transition: color 0.15s; padding: 0;
    }
    .footer-legal button:hover { color: var(--text-primary); }

    /* Legal modal */
    .legal-modal {
      background: var(--surface); border-radius: var(--radius-xl);
      width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: var(--shadow-xl); animation: slideUp 0.28s cubic-bezier(0.16,1,0.3,1);
    }
    .legal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px 14px;
    }
    .legal-title { font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .legal-tabs {
      display: flex; gap: 2px; padding: 0 12px; overflow-x: auto;
      border-bottom: 1px solid var(--border-light); scrollbar-width: none;
    }
    .legal-tabs::-webkit-scrollbar { display: none; }
    .legal-tab {
      padding: 10px 12px; border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-secondary);
      white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .legal-tab:hover { color: var(--text-primary); }
    .legal-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
    .legal-body { padding: 18px 24px; overflow-y: auto; }
    .legal-body h4 { font-size: 13px; font-weight: 800; color: var(--text-primary); margin: 16px 0 5px; }
    .legal-body h4:first-child { margin-top: 0; }
    .legal-body p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
    .legal-body ul { padding-left: 18px; margin: 4px 0; display: flex; flex-direction: column; gap: 3px; }
    .legal-body li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }
    .legal-note {
      background: var(--accent-soft); border: 1px solid #F2E08A; border-radius: var(--radius);
      padding: 10px 13px; font-size: 12px; color: #7A5C00; line-height: 1.55; margin-bottom: 14px;
    }
    .legal-note strong { color: #5c4500; font-weight: 800; }
    .legal-foot {
      padding: 12px 24px; border-top: 1px solid var(--border-light);
      font-size: 11px; color: var(--text-muted); background: var(--surface-2);
    }

    /* Auth Modal */
    .auth-input {
      width: 100%; padding: 13px 14px; font-size: 14px; border: 1.5px solid var(--border);
      border-radius: var(--radius); outline: none; font-family: inherit; margin-bottom: 10px;
      font-weight: 500; transition: all 0.15s; background: var(--surface-2); color: var(--text-primary);
    }
    .auth-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: var(--ring); }
    .auth-btn {
      width: 100%; padding: 13px; background: var(--ink); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: all 0.15s; margin-top: 4px;
    }
    .auth-btn:hover { background: #000; transform: translateY(-1px); box-shadow: var(--shadow); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-link {
      background: none; border: none; color: var(--text-secondary); font-size: 13px;
      cursor: pointer; text-decoration: underline; font-family: inherit; margin-top: 10px;
      font-weight: 600;
    }
    .auth-link:hover { color: var(--text-primary); }
    .auth-alert {
      padding: 11px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px;
      font-weight: 600;
    }
    .auth-alert.success { background: var(--success-light); color: #166534; border: 1px solid rgba(22,163,74,0.2); }
    .auth-alert.error { background: var(--danger-light); color: #991b1b; border: 1px solid rgba(239,68,68,0.2); }

    /* Mini chart */
    .chart-wrap { margin: 8px 0; }

    /* Cart View */
    .cart-empty {
      text-align: center; padding: 80px 20px; background: var(--surface);
      border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .cart-section {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: var(--shadow-sm); margin-bottom: 16px;
    }
    .cart-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; border-bottom: 1px solid var(--border-light);
      background: linear-gradient(90deg, var(--surface-2), var(--surface));
    }
    .cart-section-title { display: flex; align-items: center; gap: 11px; }
    .cart-section-title span { font-size: 14px; font-weight: 800; color: var(--text-primary); }
    .cart-section-title .count {
      font-size: 11px; font-weight: 800; color: var(--text-muted);
      background: var(--surface-2); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-light);
    }
    .cart-buy-btn {
      padding: 9px 16px; border: none; border-radius: var(--radius);
      font-size: 12.5px; font-weight: 800; cursor: pointer; transition: all 0.15s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      color: #fff; box-shadow: var(--shadow-sm);
    }
    .cart-buy-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); filter: brightness(1.05); }

    .cart-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 20px;
      border-bottom: 1px solid var(--border-light); transition: background 0.15s;
    }
    .cart-item:hover { background: var(--surface-2); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-img {
      width: 54px; height: 54px; object-fit: contain; border-radius: 10px;
      background: var(--surface-2); flex-shrink: 0; border: 1px solid var(--border-light); padding: 3px;
    }
    .cart-item-img-placeholder {
      width: 54px; height: 54px; border-radius: 10px;
      background: var(--surface-2); flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; font-size: 22px; border: 1px solid var(--border-light);
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 13.5px; font-weight: 600; color: var(--text-primary);
      line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .cart-item-name:hover { color: var(--info); }
    .cart-item-price {
      font-size: 15px; font-weight: 900; color: var(--text-primary); margin-top: 3px;
    }
    .cart-item-price .unit { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-left: 6px; }
    .cart-item-region {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 9.5px; font-weight: 800; color: var(--info);
      background: var(--info-light); padding: 1px 6px; border-radius: 8px; margin-left: 6px;
    }
    .cart-item-swap { margin-top: 5px; }

    .qty-control { display: flex; align-items: center; gap: 2px; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border-light); border-radius: 999px; padding: 2px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: transparent; font-size: 15px; font-weight: 700; cursor: pointer;
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; line-height: 1; padding: 0;
    }
    .qty-btn:hover:not(:disabled) { background: var(--ink); color: #fff; }
    .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .qty-val { font-size: 14px; font-weight: 800; color: var(--text-primary); min-width: 24px; text-align: center; }

    .cart-item-remove {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: transparent; color: var(--text-muted); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .cart-item-remove:hover { background: var(--danger-light); color: var(--danger); }

    .cart-total {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; background: var(--surface-2); font-size: 13px; color: var(--text-secondary); font-weight: 600;
    }
    .cart-total strong { color: var(--text-primary); font-size: 17px; font-weight: 900; }

    .cart-dino-note {
      background: #FFFBEB; border: 1px solid #FDE68A; border-radius: var(--radius);
      padding: 10px 14px; font-size: 12px; color: #92400E; margin-bottom: 16px;
      font-weight: 500;
    }

    /* --- Lista de compras: grilla producto x supermercado ------------------ */
    .lista-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .lista-select {
      padding: 8px 12px; border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 13px; font-weight: 700;
      color: var(--text-primary); font-family: inherit; cursor: pointer; max-width: 240px;
    }
    .lista-btn {
      padding: 8px 12px; border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); font-size: 12.5px; font-weight: 800;
      color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .lista-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .lista-btn.danger:hover { background: var(--danger-light); color: var(--danger); border-color: rgba(239,68,68,0.25); }

    /* Resumen: va FUERA del scroll horizontal a propósito. Como las columnas se
       ordenan por cobertura y no por precio, el súper más barato puede quedar
       fuera de pantalla a la derecha; acá siempre se ve. */
    .lista-resumen {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 14px 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 7px;
    }
    .lista-resumen-linea { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
    .lista-resumen-linea strong { color: var(--text-primary); font-weight: 900; }
    .lista-resumen-linea.mixta { color: var(--success, #059669); }
    .lista-resumen-linea.pago { color: #7C3AED; }
    /* La aclaración del tope no es decorativa: sin ella prometemos un ahorro que
       el usuario puede no tener si ya consumió el tope del mes. */
    .lista-resumen-nota {
      font-size: 11.5px; color: var(--text-muted); font-weight: 600; line-height: 1.5;
    }

    /* Badge de promo bancaria en la fila de totales. El total de góndola queda
       como número principal: el descuento depende de con qué pagues, así que no
       puede pisar el precio que ve todo el mundo. */
    .lg-promo {
      margin-top: 7px; padding: 6px 7px; border-radius: 8px;
      background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.18);
      display: flex; flex-direction: column; gap: 2px;
    }
    .lg-promo-ent {
      font-size: 10px; font-weight: 800; color: #7C3AED;
      text-transform: uppercase; letter-spacing: 0.3px; line-height: 1.3;
    }
    .lg-promo-final { font-size: 13.5px; font-weight: 900; color: var(--text-primary); }
    .lg-promo-det { font-size: 10px; font-weight: 700; color: var(--text-muted); line-height: 1.35; }
    .lg-promo.pendiente { background: var(--surface); border-style: dashed; }
    /* El ancho de la columna lo define su contenido: sin un width fijo acá, el
       texto del badge la estiraría de 116 a ~205px y con 9 súperes la grilla
       pasaría a scrollear el doble. Con el ancho clavado al de la columna, el
       texto envuelve adentro. El min-height iguala todas las variantes para que
       los botones "Cargar al carrito" queden alineados entre columnas: está
       calculado para el peor caso, que es la línea de detalle en dos renglones
       ("sólo con Plan Sueldo Singular"). Si se achica, esa variante crece sola
       y desalinea su columna. */
    .lg-promo { width: 116px; min-height: 106px; justify-content: center; }
    .lg-promo.vacia {
      background: transparent; border-color: transparent; border-style: dashed;
    }
    .lg-promo.vacia .lg-promo-det { color: var(--text-muted); opacity: 0.75; }

    /* ------------------------------------------------------------------ */
    /* Cronograma semanal                                                  */
    /* ------------------------------------------------------------------ */
    .cronograma { display: flex; flex-direction: column; gap: 16px; }
    .cr-head h2 { font-size: 22px; font-weight: 900; letter-spacing: -0.4px; margin: 0 0 4px; }
    .cr-head p { margin: 0; font-size: 13px; color: var(--text-secondary); max-width: 62ch; }
    .cr-estado {
      padding: 40px 20px; text-align: center; color: var(--text-muted);
      font-size: 14px; font-weight: 600;
    }

    .cr-filtros { display: flex; flex-direction: column; gap: 10px; }
    .cr-canal { display: flex; gap: 6px; }
    .cr-canal-btn {
      border: 1.5px solid var(--border); background: var(--surface); cursor: pointer;
      border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700;
      color: var(--text-secondary); transition: all .15s;
    }
    .cr-canal-btn:hover { border-color: var(--accent-dark); }
    .cr-canal-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .cr-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .cr-chips-label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .cr-chip {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--surface);
      border-radius: 999px; padding: 4px 10px 4px 5px; font-size: 11.5px;
      font-weight: 700; color: var(--text-secondary); transition: all .15s;
    }
    .cr-chip:hover { border-color: var(--accent-dark); }
    .cr-chip.active { background: var(--accent-soft); border-color: var(--accent-dark); color: var(--ink); }
    .cr-chip.mias { background: var(--ink); color: #fff; border-color: var(--ink); padding-left: 10px; }
    .cr-chip.limpiar { padding-left: 10px; color: var(--danger); border-color: var(--danger-light); }
    .cr-chip.vermas { padding-left: 10px; color: var(--text-primary); border-style: dashed; }

    /* La tabla scrollea en su propio contenedor y NO empuja el ancho de la
       página: con 10 súperes son ~1000px y en mobile arrastraría el body
       entero. La primera columna queda pegada porque sin el nombre del día a la
       vista, scrollear a la derecha deja la grilla sin referencia. */
    .cr-scroll {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: var(--radius-lg); background: var(--surface);
    }
    .cr-tabla { border-collapse: separate; border-spacing: 0; width: 100%; }
    .cr-tabla th, .cr-tabla td { border-bottom: 1px solid var(--border-light); }
    .cr-tabla tr:last-child th, .cr-tabla tr:last-child td { border-bottom: none; }

    .cr-th-super {
      padding: 12px 10px; background: var(--surface-2); text-align: center;
      border-bottom: 1.5px solid var(--border); min-width: 104px;
    }
    .cr-th-super img { margin: 0 auto; }

    .cr-tabla thead .cr-th-dia { background: var(--surface-2); }
    .cr-th-dia {
      position: sticky; left: 0; z-index: 2; background: var(--surface);
      padding: 10px 12px; text-align: left; min-width: 92px;
      border-right: 1px solid var(--border);
      font-size: 13px; font-weight: 800; color: var(--text-primary);
      white-space: nowrap;
    }
    .cr-dia-corto { display: none; }
    .cr-hoy-tag {
      display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px;
      background: var(--accent); color: var(--ink); font-size: 9.5px;
      font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px;
      vertical-align: middle;
    }
    .cr-hoy .cr-th-dia, .cr-hoy .cr-celda { background: var(--accent-soft); }

    .cr-celda {
      padding: 9px 8px; text-align: center; vertical-align: top; cursor: pointer;
      transition: background .12s;
    }
    .cr-celda:hover { background: var(--bg); }
    .cr-celda.vacia { color: var(--text-muted); font-weight: 700; cursor: default; }
    .cr-celda.vacia:hover { background: transparent; }
    .cr-pct { font-size: 19px; font-weight: 900; letter-spacing: -0.6px; color: var(--success); }
    /* Gris y no verde cuando pide una categoría de cliente: el número existe
       pero no le corresponde a cualquiera, y pintarlo igual que uno sin
       requisito es prometer un ahorro que la mayoría no tiene. */
    .cr-celda.con-requisito .cr-pct { color: var(--text-secondary); }
    .cr-ent {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 10.5px; font-weight: 700; color: var(--text-secondary);
      margin-top: 2px; line-height: 1.2;
    }
    .cr-marcas { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 4px; }
    .cr-marca {
      font-size: 8.5px; font-weight: 800; padding: 1.5px 5px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.2px; white-space: nowrap;
    }
    .cr-marca.reintegro { background: var(--info-light); color: var(--info); }
    .cr-marca.sucursal  { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border-light); }
    .cr-marca.requisito { background: var(--accent-soft); color: var(--accent-dark); }
    .cr-marca.mas       { background: var(--bg); color: var(--text-secondary); }

    .cr-nota { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; margin: 0; }
    .cr-link {
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--text-primary); font-weight: 800; text-decoration: underline;
      font-size: inherit; font-family: inherit;
    }

    .cr-detalle-item { padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .cr-detalle-item:last-child { border-bottom: none; }
    .cr-detalle-top { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .cr-detalle-pct { margin-left: auto; font-size: 20px; font-weight: 900; color: var(--success); }
    .cr-detalle-item ul { margin: 8px 0 0; padding-left: 18px; }
    .cr-detalle-item li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }
    .cr-detalle-legal { color: var(--text-muted) !important; font-size: 11px !important; }

    @media (max-width: 720px) {
      .cr-dia-largo { display: none; }
      .cr-dia-corto { display: inline; }
      .cr-th-dia { min-width: 58px; padding: 8px; font-size: 12px; }
      .cr-th-super { min-width: 86px; padding: 9px 6px; }
      .cr-pct { font-size: 16px; }
      /* Una sola fila que scrollea. `-webkit-overflow-scrolling` y el
         `flex: 0 0 auto` de los chips son necesarios: sin el segundo, flex los
         comprime para que entren y quedan ilegibles en vez de scrollear. */
      .cr-chips--fila {
        flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px;
        -webkit-overflow-scrolling: touch; scrollbar-width: none;
      }
      .cr-chips--fila::-webkit-scrollbar { display: none; }
      .cr-chips--fila .cr-chip { flex: 0 0 auto; }
    }

    /* Selector de medios de pago */
    /* .mp-item dejó de ser un <button> al meterle adentro los chips de
       categoría: un botón no puede contener otro botón. Ahora es el contenedor
       y el clickable es .mp-item-head. */
    .mp-item {
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--surface); transition: all 0.15s; overflow: hidden;
      /* .mp-lista es flex column con max-height: sin esto los items se achican
         para entrar y `overflow: hidden` recorta la segunda fila de chips. Antes
         no se notaba porque todos medían lo mismo. */
      flex-shrink: 0;
    }
    .mp-item:hover { border-color: #D3D8DF; }
    .mp-item.on { border-color: #7C3AED; background: rgba(124,58,237,0.06); }
    .mp-item-head {
      display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px;
      background: none; border: none; cursor: pointer; transition: background 0.15s;
      text-align: left; width: 100%; font-family: inherit;
    }
    .mp-item:not(.on) .mp-item-head:hover { background: var(--surface-2); }
    /* La entidad que aplica siempre va deshabilitada, pero NO atenuada: no está
       "no disponible", está concedida. Bajarle la opacidad como a un control
       inactivo diría lo contrario de lo que pasa. Solo se le saca el cursor de
       mano, que es lo que prometería que hay algo para tocar. */
    .mp-item.fija .mp-item-head { cursor: default; opacity: 1; }
    /* Los chips arrancan alineados con el NOMBRE del banco, no con el tilde. La
       sangría se escribe sumada en vez de resuelta (era un 38px pelado) porque
       depende de tres medidas de .mp-item-head: si cambia el chip del logo o el
       gap, acá se ve cuál término hay que tocar. */
    .mp-tramos {
      padding: 0 10px 9px calc(10px  /* padding izq. de .mp-item-head */
                             + 18px  /* .mp-item-check */
                             + 10px  /* gap */
                             + 24px  /* PagoLogo */
                             + 10px  /* gap */);
    }
    .mp-tramos-tit {
      font-size: 10.5px; font-weight: 700; color: var(--text-muted);
      margin-bottom: 6px; line-height: 1.45;
    }
    /* Entidades sin tramo base (NaranjaX): mientras no elija categoría el
       usuario no ve ningún descuento, así que el aviso no puede ser gris de
       fondo como el de las que igual dan algo. */
    .mp-tramos-tit.obligatoria { color: var(--warning); }
    .mp-tramos-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .mp-tramo {
      padding: 5px 9px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); font-size: 11.5px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .mp-tramo:hover { border-color: #B79BEE; }
    .mp-tramo.on { border-color: #7C3AED; background: #7C3AED; color: #fff; }
    .mp-item-check {
      width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border);
      flex-shrink: 0; margin-top: 1px; display: flex; align-items: center;
      justify-content: center; font-size: 11px; color: #fff; font-weight: 900;
    }
    .mp-item.on .mp-item-check { background: #7C3AED; border-color: #7C3AED; }
    .mp-item-nombre { font-size: 13px; font-weight: 800; color: var(--text-primary); }
    .mp-item-supers { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
    .mp-lista { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
    .mp-save {
      margin-top: 14px; width: 100%; padding: 11px; border-radius: var(--radius);
      border: none; background: #7C3AED; color: #fff; font-size: 13.5px;
      font-weight: 800; cursor: pointer; font-family: inherit;
    }
    .mp-save:disabled { opacity: 0.6; cursor: default; }

    /* Un ÚNICO contenedor de scroll para toda la grilla: si scrollease cada fila
       por su cuenta, la fila de totales se desalinearía de las columnas.
       overflow-x:auto fuerza overflow-y a auto, así que el max-height es lo que
       hace que el thead/tfoot sticky se peguen al panel. Con listas cortas ni
       se llega al tope y no hay scroll vertical anidado. */
    .lista-grid-wrap {
      overflow: auto; max-height: 75vh;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface); box-shadow: var(--shadow-sm);
      -webkit-overflow-scrolling: touch;
    }
    .lista-grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    .lista-grid th, .lista-grid td { border-bottom: 1px solid var(--border); }

    /* Columna de producto: fija al scrollear en horizontal. */
    .lg-prod, .lg-corner, .lg-corner-bottom {
      position: sticky; left: 0; background: var(--surface);
      text-align: left; min-width: 210px; max-width: 260px;
      box-shadow: 1px 0 0 var(--border);
    }
    .lg-prod { z-index: 2; padding: 10px 14px; }
    .lg-corner { z-index: 4; top: 0; padding: 10px 14px; }
    .lg-corner-bottom { z-index: 4; bottom: 0; background: var(--surface-2); padding: 10px 14px; }

    /* Header de súpers: fijo arriba. */
    .lg-super {
      position: sticky; top: 0; z-index: 3; background: var(--surface);
      min-width: 116px; padding: 10px 12px; text-align: center;
      font-size: 11.5px; font-weight: 800; color: var(--text-secondary);
    }
    .lg-super-inner { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    /* Fila de totales: fija abajo. */
    .lg-total {
      position: sticky; bottom: 0; z-index: 3; background: var(--surface-2);
      padding: 10px 12px; text-align: center; min-width: 116px;
    }
    .lg-total-monto { font-size: 15px; font-weight: 900; color: var(--text-primary); }
    .lg-total-nota { font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin-top: 2px; }
    .lg-total-nota.completa { color: var(--success, #059669); }
    .lg-total-btn {
      margin-top: 7px; width: 100%; padding: 6px 8px; border-radius: 8px; border: none;
      font-size: 10.5px; font-weight: 800; cursor: pointer; font-family: inherit;
      background: var(--ink); color: #fff; transition: opacity 0.15s; white-space: nowrap;
    }
    .lg-total-btn:hover { opacity: 0.85; }
    .lg-total-btn:disabled { opacity: 0.4; cursor: default; }

    .lg-prod-row { display: flex; align-items: center; gap: 10px; }
    .lg-prod-img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid var(--border); flex-shrink: 0; }
    .lg-prod-nombre {
      font-size: 12.5px; font-weight: 700; color: var(--text-primary); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* La imagen y el nombre abren la ficha del producto, igual que la tarjeta
       de la pestaña de productos. Van como <button> y no como onClick en el
       <th> entero: la celda también contiene los controles de cantidad y el
       botón de quitar, y un clic en "−" no tiene que abrir el modal. */
    .lg-prod-abrir {
      border: none; background: none; padding: 0; margin: 0; font: inherit;
      text-align: left; cursor: pointer; color: inherit; display: block; width: 100%;
    }
    .lg-prod-abrir:disabled { cursor: default; }
    .lg-prod-abrir:not(:disabled):hover .lg-prod-nombre { color: var(--info); text-decoration: underline; }
    .lg-prod-abrir:not(:disabled):hover .lg-prod-img { border-color: var(--info); }
    .lg-prod-abrir:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 6px; }
    .lg-prod-abrir.img { width: auto; flex-shrink: 0; }
    /* La cantidad vive acá, en la columna fija: si estuviera a la derecha
       desaparecería apenas se scrollean los precios. */
    .lg-prod-bottom { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .lg-prod-nocomp { font-size: 10px; font-weight: 700; color: var(--text-muted); font-style: italic; }

    /* Celda de precio: toda la celda es el botón de "agregar al carrito". */
    .lg-cell {
      min-width: 116px; padding: 0; text-align: center; vertical-align: middle;
    }
    .lg-cell-btn {
      width: 100%; min-height: 56px; border: none; background: transparent;
      font-family: inherit; font-size: 13.5px; font-weight: 800; color: var(--text-primary);
      cursor: pointer; padding: 10px 8px; transition: background 0.14s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .lg-cell-btn:hover { background: var(--surface-2); }
    .lg-cell-btn:disabled { cursor: default; color: var(--text-muted); font-weight: 600; }
    .lg-cell-btn:disabled:hover { background: transparent; }
    .lg-cell.mejor .lg-cell-btn { background: #ECFDF5; color: #065F46; }
    .lg-cell.mejor .lg-cell-btn:hover { background: #D1FAE5; }
    .lg-cell.en-carrito .lg-cell-btn { background: var(--accent); color: #1b1600; }
    /* "En el carrito" tiene que ganarle a "más barato" también en hover: con la
       regla de .mejor la celda perdía el ámbar justo al apuntarle para sacarla,
       o sea que el color decía lo contrario de lo que el clic iba a hacer. */
    .lg-cell.en-carrito .lg-cell-btn:hover { background: var(--accent); filter: brightness(0.94); }
    .lg-cell-tag { font-size: 9.5px; font-weight: 800; letter-spacing: 0.3px; opacity: 0.75; }
    .lg-cell-add { font-size: 9.5px; font-weight: 800; opacity: 0; transition: opacity 0.14s; }
    .lg-cell-btn:hover .lg-cell-add { opacity: 0.6; }
    /* La celda que ya está en el carrito se vuelve a tocar para sacar el
       producto. Los dos carteles se apilan en la misma celda de grilla y se
       cruzan en hover: así la segunda acción se anuncia antes del clic sin que
       la fila cambie de alto al pasar el mouse. */
    .lg-cell-swap { display: grid; }
    .lg-cell-swap > * { grid-area: 1 / 1; transition: opacity 0.14s; }
    .lg-swap-quitar { opacity: 0; }
    .lg-cell-btn:hover .lg-swap-puesto { opacity: 0; }
    .lg-cell-btn:hover .lg-swap-quitar { opacity: 1; }

    @media (max-width: 640px) {
      .lg-prod, .lg-corner, .lg-corner-bottom { min-width: 150px; max-width: 170px; }
      .lg-prod { padding: 9px 10px; }
      .lg-prod-img { width: 32px; height: 32px; }
      .lg-prod-nombre { font-size: 11.5px; }
      .lg-super, .lg-cell, .lg-total { min-width: 96px; }
      /* La columna pasa de 92 a 72 px útiles: los logos siguen esa proporción
         todos juntos, así el equilibrio de áreas no se rompe (ver _cajaLogoGrilla). */
      .lg-super-inner { --k-logo: 0.78; }
      .lg-promo { width: 96px; min-height: 122px; }
      .lg-promo-det { font-size: 9.5px; }
      /* En móvil el "+" del hover no existe: la celda se toca y listo. */
      .lg-cell-add { display: none; }
    }

    /* Confirm Modal */
    .confirm-modal {
      background: var(--surface); border-radius: var(--radius-xl);
